[project]
name = "lowerduckpond-m3-archive"
version = "0.0.0"
description = "Fail-closed Milestone 3 archive storage qualification"
requires-python = ">=3.14,<3.15"
dependencies = [
  "botocore>=1.43.70,<1.44",
]

[project.scripts]
ldp-m3-archive = "lowerduckpond_m3_archive.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = ["minio: exercises versioned S3 behavior against the pinned local MinIO image"]
