[project]
name = "lowerduckpond-static-operator"
version = "0.0.0"
description = "Trusted-workstation client for Lower Duck Pond static publication"
requires-python = ">=3.14,<3.15"
dependencies = [
  "lowerduckpond-static-contracts",
]

[project.scripts]
ldp-static-operator = "lowerduckpond_static_operator.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
