---
name: Disposable successor diagnostic

on:
  push:
    branches: [diag/m3-12-p3-audit-collector]

permissions:
  contents: read

jobs:
  audit-collector:
    name: Disposable successor audit diagnostic
    runs-on: ubuntu-24.04
    steps:
      - name: Check out diagnostic revision with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
        with:
          github_token: ${{ github.token }}
          persist_github_token: false
          cache_save: false
          version: 2026.8.8
          install_args: just python uv
      - name: Build and check the pinned local MinIO fixture
        run: |
          umask 077
          if just check-m3-archive-storage > "$RUNNER_TEMP/ldp-storage-private.log" 2>&1; then
            exit 0
          else
            status=$?
            printf 'Pinned MinIO fixture preflight exited %d.\n' "$status"
            exit "$status"
          fi
      - name: Run the single successor rollout group
        env:
          LDP_QUALIFICATION_TIMING_DIRECTORY: ${{ runner.temp }}/ldp-installed
        run: |
          umask 077
          if just check-installed-group successor-rollout > "$RUNNER_TEMP/ldp-successor-private.log" 2>&1; then
            exit 0
          else
            status=$?
            printf 'Installed successor rollout exited %d.\n' "$status"
            exit "$status"
          fi
      - name: Retain allowlisted failure receipts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: disposable-successor-diagnostic
          path: |
            ${{ runner.temp }}/ldp-installed/m3-12-successor-progress/enabled-repeat-ansible-failure.json
            ${{ runner.temp }}/ldp-installed/m3-12-successor-progress/enabled-repeat-ansible-recap.json
            ${{ runner.temp }}/ldp-installed/m3-12-successor-progress/enabled-repeat-audit-unit.json
          if-no-files-found: ignore
          retention-days: 1
