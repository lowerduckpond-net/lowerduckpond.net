---
name: M3.11 credential cleanup
run-name: M3.11 ${{ inputs.operation || 'confirm' }}

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Confirm pending approved lease manifests or reconcile cleanup only
        type: choice
        options: [confirm, cleanup]
        default: confirm

permissions:
  contents: read

concurrency:
  group: m3-11-credential-cleanup
  cancel-in-progress: false

jobs:
  connect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: m3-11-credential-cleanup
    steps:
      - name: Capture the executable pin from the versioned private bundle
        id: selection
        env:
          BOOTSTRAP: ${{ secrets.M3_11_CONNECT_BOOTSTRAP }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import re
          value = json.loads(os.environ['BOOTSTRAP'])
          if value.get('format') != 'lowerduckpond-m3-11-independent-lease-bundle-v1':
              raise SystemExit('Independent cleanup bundle format is unavailable')
          helper = value['configuration']['helper_revision']
          if not isinstance(helper, str) or re.fullmatch('[0-9a-f]{40}', helper) is None:
              raise SystemExit('Independent cleanup has no exact executable pin')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('helper_revision=' + helper + '\n')
          PYCODE
      - name: Check out the pinned lifecycle helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.selection.outputs.helper_revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: python uv
      - name: Install locked dependencies
        run: uv sync --all-packages --all-groups --frozen
      - name: Prepare private registry configuration
        run: |
          install -d -m 700 "$RUNNER_TEMP/ldp-dockerhub"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/ldp-dockerhub" >> "$GITHUB_ENV"
      - name: Authenticate public Docker Hub pulls
        if: vars.DOCKERHUB_USERNAME != ''
        # Registry login failure must not prevent an attempted credential cleanup.
        continue-on-error: true
        timeout-minutes: 2
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PUBLIC_READ_TOKEN }}
          logout: true
      - name: Confirm manifests and reconcile credential obligations
        uses: ./.github/actions/m3-11-connect
        env:
          M3_11_HELPER_REVISION: ${{ steps.selection.outputs.helper_revision }}
          M3_11_CONNECT_BOOTSTRAP: ${{ secrets.M3_11_CONNECT_BOOTSTRAP }}
          M3_11_CONNECT_OPERATION: ${{ inputs.operation || 'confirm' }}
      - name: Preserve only the constructed cleanup receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-11-credential-cleanup-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-11-connect/receipt.json
          retention-days: 30
          if-no-files-found: warn
