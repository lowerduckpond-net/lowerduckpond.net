---
name: M3.11 credential cleanup

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3-11-credential-cleanup
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    environment: m3-11-credential-cleanup
    steps:
      - name: Require the approved lifecycle helper revision
        env:
          HELPER_REVISION: ${{ vars.M3_11_CLEANUP_REVISION }}
        run: |
          [[ "$HELPER_REVISION" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out the pinned lifecycle helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.M3_11_CLEANUP_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: python uv
      - name: Install the established 1Password CLI and locked dependencies
        run: |
          mise install aqua:1password/cli@2.33.0
          uv sync --all-packages --all-groups --frozen
      - name: Prepare the encrypted journal cache directory
        run: install -d -m 700 "$RUNNER_TEMP/m3-11-journal-cache"
      - name: Restore encrypted immutable journal reads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/m3-11-journal-cache/journal.json
          key: m3-11-journal-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: m3-11-journal-v1-
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
      - name: Deliver cleanup authority privately
        env:
          CLEANUP_CONFIGURATION: ${{ secrets.M3_11_CLEANUP_CONFIG }}
        run: |
          umask 077
          uv run --no-sync --frozen python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.m3_11_private_inputs import write_private
          from scripts.m3_11_unattended.config import cleanup_configuration
          path = Path(os.environ['RUNNER_TEMP']) / 'm3-11-cleanup.json'
          write_private(path, json.loads(os.environ['CLEANUP_CONFIGURATION']))
          cleanup_configuration(path)
          PY
      - name: Reconcile and verify outstanding credentials
        run: |
          trap 'rm -f "$RUNNER_TEMP/m3-11-cleanup.json"' EXIT
          mise exec aqua:1password/cli@2.33.0 -- uv run --no-sync --frozen python \
            -m scripts.m3_11_unattended.cleanup --actor github \
            --config "$RUNNER_TEMP/m3-11-cleanup.json" \
            --journal-cache "$RUNNER_TEMP/m3-11-journal-cache/journal.json" \
            > "$RUNNER_TEMP/m3-11-cleanup-receipt.json"
      - name: Retain only encrypted journal read acceleration
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/m3-11-journal-cache/journal.json
          key: m3-11-journal-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve only the constructed cleanup receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-11-credential-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-11-cleanup-receipt.json
          retention-days: 30
          if-no-files-found: warn
