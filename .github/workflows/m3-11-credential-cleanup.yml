---
name: M3.11 credential cleanup
run-name: M3.11 cleanup ${{ inputs.operation || 'reconcile' }} ${{ inputs.run_sha256 }}

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit Connect initialization, cleanup, or bounded creation witness
        type: choice
        options: [reconcile, discovery, genesis, witness]
        default: reconcile
      run_sha256:
        description: Exact approved run request digest, required only for witness
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: m3-11-credential-cleanup
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    environment: m3-11-credential-cleanup
    steps:
      - name: Select the explicit cleanup backend
        id: backend
        env:
          BACKEND: ${{ vars.M3_11_CLEANUP_BACKEND }}
          OPERATION: ${{ inputs.operation || 'reconcile' }}
        run: |
          case "$BACKEND" in ''|service-account|connect) ;; *) exit 1 ;; esac
          if [[ "$BACKEND" != connect && "$OPERATION" == reconcile ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Require the approved lifecycle helper revision
        if: steps.backend.outputs.enabled == 'true'
        env:
          HELPER_REVISION: ${{ vars.M3_11_CLEANUP_REVISION }}
        run: |
          [[ "$HELPER_REVISION" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out the pinned lifecycle helper
        if: steps.backend.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.M3_11_CLEANUP_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        if: steps.backend.outputs.enabled == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: python uv
      - name: Install the established 1Password CLI and locked dependencies
        if: steps.backend.outputs.enabled == 'true'
        run: |
          mise install aqua:1password/cli@2.33.0
          uv sync --all-packages --all-groups --frozen
      - name: Prepare the encrypted journal cache directory
        if: steps.backend.outputs.enabled == 'true'
        run: install -d -m 700 "$RUNNER_TEMP/m3-11-journal-cache"
      - name: Restore encrypted immutable journal reads
        if: steps.backend.outputs.enabled == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/m3-11-journal-cache/journal.json
          key: m3-11-journal-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: m3-11-journal-v1-
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
      - name: Separate restored input from newly validated cache output
        if: steps.backend.outputs.enabled == 'true'
        id: cache_input
        run: |
          if [[ -e "$RUNNER_TEMP/m3-11-journal-cache/journal.json" || -L "$RUNNER_TEMP/m3-11-journal-cache/journal.json" ]]; then
            mv -T "$RUNNER_TEMP/m3-11-journal-cache/journal.json" "$RUNNER_TEMP/m3-11-journal-cache/restored.json"
          fi
      - name: Deliver cleanup authority privately
        if: steps.backend.outputs.enabled == 'true'
        env:
          CLEANUP_CONFIGURATION: ${{ secrets.M3_11_CLEANUP_CONFIG }}
        run: |
          umask 077
          uv run --no-sync --frozen python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.m3_11_private_inputs import write_private
          from scripts.m3_11_unattended.config import cleanup_configuration
          path = Path(os.environ['RUNNER_TEMP']) / 'm3-11-cleanup.json'
          write_private(path, json.loads(os.environ['CLEANUP_CONFIGURATION']))
          cleanup_configuration(path)
          PY
      - name: Reconcile and verify outstanding credentials
        if: steps.backend.outputs.enabled == 'true'
        run: |
          trap 'rm -f "$RUNNER_TEMP/m3-11-cleanup.json"' EXIT
          mise exec aqua:1password/cli@2.33.0 -- uv run --no-sync --frozen python \
            -m scripts.m3_11_unattended.cleanup --actor github \
            --config "$RUNNER_TEMP/m3-11-cleanup.json" \
            --journal-cache "$RUNNER_TEMP/m3-11-journal-cache/restored.json" \
            --journal-cache-output "$RUNNER_TEMP/m3-11-journal-cache/journal.json" \
            > "$RUNNER_TEMP/m3-11-cleanup-receipt.json"
      - name: Retain only encrypted journal read acceleration
        if: always() && steps.cache_input.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/m3-11-journal-cache/journal.json
          key: m3-11-journal-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve only the constructed cleanup receipt
        if: always() && steps.backend.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-11-credential-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-11-cleanup-receipt.json
          retention-days: 30
          if-no-files-found: warn
  connect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: m3-11-credential-cleanup
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - name: Select the explicit cleanup backend
        id: backend
        env:
          BACKEND: ${{ vars.M3_11_CLEANUP_BACKEND }}
          OPERATION: ${{ inputs.operation || 'reconcile' }}
        run: |
          case "$BACKEND" in ''|service-account|connect) ;; *) exit 1 ;; esac
          if [[ "$BACKEND" == connect || "$OPERATION" != reconcile ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Require the approved lifecycle helper revision
        if: steps.backend.outputs.enabled == 'true'
        env:
          HELPER_REVISION: ${{ vars.M3_11_CLEANUP_REVISION }}
        run: |
          [[ "$HELPER_REVISION" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out the pinned lifecycle helper
        if: steps.backend.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.M3_11_CLEANUP_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        if: steps.backend.outputs.enabled == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: python uv
      - name: Install locked dependencies
        if: steps.backend.outputs.enabled == 'true'
        run: uv sync --all-packages --all-groups --frozen
      - name: Reconcile through independent Connect and recoverable checkpoints
        if: steps.backend.outputs.enabled == 'true'
        uses: ./.github/actions/m3-11-connect
        env:
          GH_TOKEN: ${{ github.token }}
          M3_11_HELPER_REVISION: ${{ vars.M3_11_CLEANUP_REVISION }}
          M3_11_CONNECT_BOOTSTRAP: ${{ secrets.M3_11_CONNECT_BOOTSTRAP }}
          M3_11_CONNECT_CONFIGURATION: ${{ vars.M3_11_CONNECT_CONFIGURATION }}
          M3_11_CONNECT_OPERATION: ${{ inputs.operation || 'reconcile' }}
          M3_11_CONNECT_RUN_SHA256: ${{ inputs.run_sha256 }}
      - name: Preserve only the constructed cleanup receipt
        if: always() && steps.backend.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-11-credential-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-11-connect/receipt.json
          retention-days: 30
          if-no-files-found: warn
