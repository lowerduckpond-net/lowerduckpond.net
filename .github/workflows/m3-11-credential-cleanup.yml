---
name: M3.11 credential cleanup
run-name: M3.11 ${{ inputs.operation || 'reconcile' }}

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Reconcile installed cleanup, or explicitly confirm/clean up a lease bundle
        type: choice
        options: [reconcile, confirm, cleanup]
        default: reconcile

permissions:
  contents: read

concurrency:
  group: m3-11-credential-cleanup
  cancel-in-progress: false

jobs:
  # Temporary pre-cutover compatibility: execute only the existing pinned cleaner.
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    environment: m3-11-credential-cleanup
    steps:
      - name: Select the explicit cleanup backend
        id: backend
        env:
          BACKEND: ${{ vars.M3_11_CLEANUP_BACKEND }}
          OPERATION: ${{ inputs.operation || 'reconcile' }}
          LEGACY_HELPER: ${{ vars.M3_11_CLEANUP_REVISION }}
          CONFIGURATION: ${{ vars.M3_11_CONNECT_CONFIGURATION }}
        run: |
          case "$BACKEND" in ''|service-account|connect-initializing|connect) ;; *) exit 1 ;; esac
          if [[ "$BACKEND" != connect && "$OPERATION" == reconcile ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          import re
          helper = os.environ['LEGACY_HELPER']
          quiet = os.environ['BACKEND'] == 'connect-initializing'
          if quiet:
              value = json.loads(os.environ['CONFIGURATION'])
              helper = value.get('active_helper') if isinstance(value, dict) else None
          if not isinstance(helper, str) or re.fullmatch('[0-9a-f]{40}', helper) is None:
              raise SystemExit('Cleanup has no exact executable pin')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('helper_revision=' + helper + '\n')
              output.write('quiet_empty=' + str(quiet).lower() + '\n')
          PY
      - name: Require the approved lifecycle helper revision
        if: steps.backend.outputs.enabled == 'true'
        env:
          HELPER_REVISION: ${{ steps.backend.outputs.helper_revision }}
        run: |
          [[ "$HELPER_REVISION" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out the pinned lifecycle helper
        if: steps.backend.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.backend.outputs.helper_revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        if: steps.backend.outputs.enabled == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: python uv
      - name: Install the established 1Password CLI and locked dependencies
        if: steps.backend.outputs.enabled == 'true'
        run: |
          mise install aqua:1password/cli@2.33.0
          uv sync --all-packages --all-groups --frozen
      - name: Prepare the encrypted journal cache directory
        if: steps.backend.outputs.enabled == 'true'
        run: install -d -m 700 "$RUNNER_TEMP/m3-11-journal-cache"
      - name: Restore encrypted immutable journal reads
        if: steps.backend.outputs.enabled == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/m3-11-journal-cache/journal.json
          key: m3-11-journal-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: m3-11-journal-v1-
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
      - name: Separate restored input from newly validated cache output
        if: steps.backend.outputs.enabled == 'true'
        id: cache_input
        run: |
          if [[ -e "$RUNNER_TEMP/m3-11-journal-cache/journal.json" || -L "$RUNNER_TEMP/m3-11-journal-cache/journal.json" ]]; then
            mv -T "$RUNNER_TEMP/m3-11-journal-cache/journal.json" "$RUNNER_TEMP/m3-11-journal-cache/restored.json"
          fi
      - name: Deliver cleanup authority privately
        if: steps.backend.outputs.enabled == 'true'
        env:
          CLEANUP_CONFIGURATION: ${{ secrets.M3_11_CLEANUP_CONFIG }}
        run: |
          umask 077
          uv run --no-sync --frozen python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.m3_11_private_inputs import write_private
          from scripts.m3_11_unattended.config import cleanup_configuration
          path = Path(os.environ['RUNNER_TEMP']) / 'm3-11-cleanup.json'
          write_private(path, json.loads(os.environ['CLEANUP_CONFIGURATION']))
          cleanup_configuration(path)
          PY
      - name: Reconcile and verify outstanding credentials
        if: steps.backend.outputs.enabled == 'true'
        env:
          QUIET_EMPTY: ${{ steps.backend.outputs.quiet_empty }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/m3-11-cleanup.json"' EXIT
          arguments=()
          if [[ "$QUIET_EMPTY" == true ]]; then arguments+=(--quiet-empty); fi
          mise exec aqua:1password/cli@2.33.0 -- uv run --no-sync --frozen python \
            -m scripts.m3_11_unattended.cleanup --actor github \
            "${arguments[@]}" \
            --config "$RUNNER_TEMP/m3-11-cleanup.json" \
            --journal-cache "$RUNNER_TEMP/m3-11-journal-cache/restored.json" \
            --journal-cache-output "$RUNNER_TEMP/m3-11-journal-cache/journal.json" \
            > "$RUNNER_TEMP/m3-11-cleanup-receipt.json"
      - name: Retain only encrypted journal read acceleration
        if: always() && steps.cache_input.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/m3-11-journal-cache/journal.json
          key: m3-11-journal-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve only the constructed cleanup receipt
        if: always() && steps.backend.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-11-credential-cleanup-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-11-cleanup-receipt.json
          retention-days: 30
          if-no-files-found: warn
  connect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: m3-11-credential-cleanup
    # The pinned legacy action still needs its checkpoint transport permissions.
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - name: Select the installed cleanup contract without activating a replacement
        id: selection
        env:
          BACKEND: ${{ vars.M3_11_CLEANUP_BACKEND }}
          OPERATION: ${{ inputs.operation || 'reconcile' }}
          CONFIGURATION: ${{ vars.M3_11_CONNECT_CONFIGURATION }}
          BOOTSTRAP: ${{ secrets.M3_11_CONNECT_BOOTSTRAP }}
          IMPORT_BRIDGE: ${{ vars.M3_11_LEGACY_IMPORT_BRIDGE }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import re

          try:
              backend = os.environ['BACKEND']
              operation = os.environ['OPERATION']
              if backend not in {'', 'service-account', 'connect-initializing', 'connect'}:
                  raise ValueError()
              if operation not in {'reconcile', 'confirm', 'cleanup'}:
                  raise ValueError()
              output = {'enabled': 'false'}
              if backend != 'connect':
                  if operation != 'reconcile':
                      raise ValueError()
              else:
                  bundle = json.loads(os.environ['BOOTSTRAP'])
                  if not isinstance(bundle, dict):
                      raise ValueError()
                  if bundle.get('format') == 'lowerduckpond-m3-11-connect-bootstrap-v1':
                      # Shipping this workflow preserves the installed legacy contract.
                      if operation != 'reconcile':
                          raise ValueError()
                      required = {'format', 'targets', 'journal_vault', 'cleanup', 'token',
                                  'server_credentials', 'provider_metadata'}
                      if (set(bundle) - {'checkpoint_token'} != required
                          or not isinstance(bundle['journal_vault'], str)
                          or any(not isinstance(bundle[key], dict) for key in
                                 ('targets', 'cleanup', 'token', 'server_credentials', 'provider_metadata'))):
                          raise ValueError()
                      selected = json.loads(os.environ['CONFIGURATION'])
                      if (not isinstance(selected, dict)
                          or set(selected) != {'format', 'stage', 'active_helper', 'request', 'receipt'}
                          or selected['format'] != 'lowerduckpond-m3-11-connect-independent-v1'
                          or selected['stage'] != 'active'
                          or not isinstance(selected['request'], dict)
                          or not isinstance(selected['receipt'], dict)):
                          raise ValueError()
                      helper = selected['active_helper']
                      mode = 'legacy'
                      configuration = json.dumps(selected, separators=(',', ':'))
                  elif bundle.get('format') == 'lowerduckpond-m3-11-independent-lease-bundle-v1':
                      # Only separately approved delivery of this versioned bundle switches modes.
                      if set(bundle) != {'format', 'configuration', 'server_credentials'}:
                          raise ValueError()
                      selected = bundle['configuration']
                      if (not isinstance(selected, dict)
                          or selected.get('format') != 'lowerduckpond-m3-11-lease-config-v1'
                          or selected.get('mode') != 'cleanup-only'
                          or not isinstance(bundle['server_credentials'], dict)
                          or not bundle['server_credentials']):
                          raise ValueError()
                      helper = selected['helper_revision']
                      mode = 'lease'
                      configuration = ''
                      if operation == 'reconcile':
                          operation = 'confirm'
                  else:
                      raise ValueError()
                  if not isinstance(helper, str) or re.fullmatch('[0-9a-f]{40}', helper) is None:
                      raise ValueError()
                  output = dict(enabled='true', mode=mode, helper_revision=helper,
                                operation=operation, configuration=configuration)
                  output.update(import_bridge='false', checkout_path='.')
                  if mode == 'legacy' and os.environ.get('IMPORT_BRIDGE'):
                      bridge = json.loads(os.environ['IMPORT_BRIDGE'])
                      if (not isinstance(bridge, dict)
                          or set(bridge) != {'revision', 'journal_vault', 'migration_sha256'}
                          or helper != '0b5b198bf06443e61f01b1f7259fea827f79fc23'
                          or bridge['journal_vault'] != bundle['journal_vault']
                          or not isinstance(bridge['revision'], str)
                          or re.fullmatch('[0-9a-f]{40}', bridge['revision']) is None
                          or not isinstance(bridge['journal_vault'], str)
                          or re.fullmatch('[a-z0-9]{26}', bridge['journal_vault']) is None
                          or not isinstance(bridge['migration_sha256'], str)
                          or re.fullmatch('[0-9a-f]{64}', bridge['migration_sha256']) is None):
                          raise ValueError()
                      output.update(import_bridge='true', checkout_path='legacy-helper',
                                    bridge_revision=bridge['revision'],
                                    bridge_vault=bridge['journal_vault'],
                                    bridge_migration=bridge['migration_sha256'])
          except (ValueError, TypeError, KeyError):
              raise SystemExit('Installed cleanup selection is invalid; no replacement activated') from None
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as destination:
              for key, value in output.items():
                  destination.write(key + '=' + value + '\n')
          PYCODE
      - name: Check out the pinned lifecycle helper
        if: steps.selection.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.selection.outputs.helper_revision }}
          path: ${{ steps.selection.outputs.checkout_path }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the separately approved import reader
        if: steps.selection.outputs.import_bridge == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.selection.outputs.bridge_revision }}
          path: import-bridge
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        if: steps.selection.outputs.enabled == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: python uv
          working_directory: ${{ steps.selection.outputs.checkout_path }}
      - name: Install locked dependencies
        if: steps.selection.outputs.enabled == 'true'
        working-directory: ${{ steps.selection.outputs.checkout_path }}
        run: uv sync --all-packages --all-groups --frozen
      - name: Prepare private registry configuration
        if: steps.selection.outputs.enabled == 'true'
        run: |
          install -d -m 700 "$RUNNER_TEMP/ldp-dockerhub"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/ldp-dockerhub" >> "$GITHUB_ENV"
      - name: Authenticate public Docker Hub pulls
        if: steps.selection.outputs.enabled == 'true' && vars.DOCKERHUB_USERNAME != ''
        # Registry login failure must not prevent an attempted credential cleanup.
        continue-on-error: true
        timeout-minutes: 2
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PUBLIC_READ_TOKEN }}
          logout: true
      - name: Reconcile through the selected pinned cleanup contract
        if: steps.selection.outputs.enabled == 'true' && steps.selection.outputs.import_bridge != 'true'
        uses: ./.github/actions/m3-11-connect
        env:
          GH_TOKEN: ${{ steps.selection.outputs.mode == 'legacy' && github.token || '' }}
          M3_11_CONNECT_CONFIGURATION: ${{ steps.selection.outputs.configuration }}
          M3_11_HELPER_REVISION: ${{ steps.selection.outputs.helper_revision }}
          M3_11_CONNECT_BOOTSTRAP: ${{ secrets.M3_11_CONNECT_BOOTSTRAP }}
          M3_11_CONNECT_OPERATION: ${{ steps.selection.outputs.operation }}
      - name: Reconcile legacy cleanup with the approved import reader
        if: steps.selection.outputs.import_bridge == 'true'
        uses: ./import-bridge/.github/actions/m3-11-legacy-import-bridge
        env:
          GH_TOKEN: ${{ github.token }}
          M3_11_CONNECT_CONFIGURATION: ${{ steps.selection.outputs.configuration }}
          M3_11_HELPER_REVISION: ${{ steps.selection.outputs.helper_revision }}
          M3_11_CONNECT_BOOTSTRAP: ${{ secrets.M3_11_CONNECT_BOOTSTRAP }}
          M3_11_CONNECT_OPERATION: ${{ steps.selection.outputs.operation }}
          M3_11_LEGACY_ROOT: ${{ github.workspace }}/legacy-helper
          M3_11_BRIDGE_VAULT: ${{ steps.selection.outputs.bridge_vault }}
          M3_11_BRIDGE_MIGRATION: ${{ steps.selection.outputs.bridge_migration }}
      - name: Preserve the import reader observation
        if: always() && steps.selection.outputs.import_bridge == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-11-import-reader-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-11-import-reader/observation.json
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve only the constructed cleanup receipt
        if: always() && steps.selection.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-11-credential-cleanup-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-11-connect/receipt.json
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve constructed journal observation diagnostics
        if: always() && steps.selection.outputs.mode == 'legacy'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-11-journal-observation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-11-connect/journal-observation-failure.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Preserve constructed uncertain-creation history diagnostics
        if: always() && steps.selection.outputs.mode == 'legacy'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-11-creation-checkpoint-audit-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-11-connect/creation-checkpoint-audit.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Preserve allowlisted cleanup timing events
        if: always() && steps.selection.outputs.mode == 'legacy'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-11-cleanup-timing-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-11-connect/timing-events.jsonl
          retention-days: 30
          if-no-files-found: ignore
