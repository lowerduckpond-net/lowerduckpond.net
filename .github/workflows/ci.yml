---
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just python uv github:gitleaks/gitleaks opentofu
      - name: Run hooks
        run: just check-pre-commit

  links:
    name: Links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just github:lycheeverse/lychee
      - name: Check links
        run: just check-links

  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just python uv
      - name: Check Python
        run: just check-python

  m3-qualification:
    name: M3 qualification (local)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just python uv
      - name: Check local M3 assumptions
        run: just check-m3-qualification

  m3-contract-spine:
    name: M3 contract spine
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just python uv
      - name: Check standalone contract and root-domain wheels
        run: just check-m3-contract-spine

  m3-archive-storage:
    name: M3 archive storage (local)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just python uv
      - name: Check versioned archive storage behavior
        run: just check-m3-archive-storage

  cloudflare-networks:
    name: Cloudflare networks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just python uv
      - name: Check reviewed Cloudflare proxy ranges
        run: just check-cloudflare-networks

  opentofu:
    name: OpenTofu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just opentofu github:terraform-linters/tflint github:aquasecurity/trivy
      - name: Check OpenTofu
        run: just check-opentofu

  ansible-static:
    name: Ansible static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just python uv
      - name: Check static and baseline Ansible behavior
        run: just check-ansible-static

  ansible-m3-8:
    name: Ansible M3.8
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select installed-host qualification
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_REVISION: ${{ github.event.before }}
          PUSH_HEAD_REVISION: ${{ github.sha }}
        run: |
          case "${EVENT_NAME}" in
            pull_request)
              base_revision=${PR_BASE_REVISION}
              head_revision=${PR_HEAD_REVISION}
              ;;
            push)
              base_revision=${PUSH_BASE_REVISION}
              head_revision=${PUSH_HEAD_REVISION}
              ;;
            *)
              echo "required=true" >> "${GITHUB_OUTPUT}"
              echo "A scheduled or manual run requires the full installed-host gate."
              exit 0
              ;;
          esac
          if required=$(scripts/m3-8-ci-required \
            "${base_revision}" "${head_revision}"); then
            :
          else
            echo "M3.8 CI selection failed; running the full gate." >&2
            required=true
          fi
          echo "required=${required}" >> "${GITHUB_OUTPUT}"
          if [[ "${required}" == true ]]; then
            echo "Relevant files changed; the full installed-host gate is required."
          else
            echo "Installed-host inputs are unchanged; the full gate is not required."
          fi
      - name: Install tools
        if: steps.selection.outputs.required == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just python uv
      - name: Check installed M3.8 lifecycle behavior
        if: steps.selection.outputs.required == 'true'
        run: just check-ansible-m3-8
      - name: Record the selective skip
        if: steps.selection.outputs.required != 'true'
        run: >-
          echo "Ansible M3.8 skipped because its installed-host inputs did not change."

  ansible:
    name: Ansible
    if: always()
    needs: [ansible-static, ansible-m3-8]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both Ansible validation lanes
        env:
          STATIC_RESULT: ${{ needs.ansible-static.result }}
          M3_8_RESULT: ${{ needs.ansible-m3-8.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$M3_8_RESULT" = success

  actions:
    name: Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just github:rhysd/actionlint
      - name: Check GitHub Actions
        run: just check-actions

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just github:gitleaks/gitleaks
      - name: Scan for secrets
        run: just check-secrets

  gate:
    name: Gate
    if: always()
    needs: [pre-commit, links, python, m3-contract-spine, m3-qualification, m3-archive-storage, cloudflare-networks, opentofu, ansible, actions, secrets]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation job
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* || "$RESULTS" == *skipped* ]]; then
            exit 1
          fi
          echo "All required validation jobs passed."
