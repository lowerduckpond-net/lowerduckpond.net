---
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just python uv github:gitleaks/gitleaks opentofu
      - name: Run hooks
        run: just check-pre-commit

  links:
    name: Links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just github:lycheeverse/lychee
      - name: Check links
        run: just check-links

  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just python uv
      - name: Check Python
        run: just check-python-core

  python-recovery:
    name: Python recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just python uv
      - name: Check host-reconstruction components
        run: just check-python-recovery

  m3-qualification:
    name: M3 qualification (local)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just python uv
      - name: Check local M3 assumptions
        run: just check-m3-qualification

  m3-contract-spine:
    name: M3 contract spine
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just python uv
      - name: Check standalone contract and root-domain wheels
        run: just check-m3-contract-spine

  m3-archive-storage:
    name: M3 archive storage (local)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just python uv
      - name: Check versioned archive storage behavior
        run: just check-m3-archive-storage
      - name: Export the tested local storage fixture
        run: |
          fixture_image=$(uv run --quiet --frozen python -m scripts.qualification_minio)
          docker image save --output "$RUNNER_TEMP/minio-fixture.tar" "$fixture_image"
      - name: Share the tested fixture within this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minio-fixture
          path: ${{ runner.temp }}/minio-fixture.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  cloudflare-networks:
    name: Cloudflare networks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just python uv
      - name: Check reviewed Cloudflare proxy ranges
        run: just check-cloudflare-networks

  opentofu:
    name: OpenTofu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just opentofu github:terraform-linters/tflint github:aquasecurity/trivy
      - name: Check OpenTofu
        run: just check-opentofu

  ansible-static:
    name: Ansible static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just python uv
      - name: Check static and baseline Ansible behavior
        run: just check-ansible-static

  installed-selection:
    name: Installed check selection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.plan.outputs.selection }}
      matrix: ${{ steps.plan.outputs.matrix }}
      required: ${{ steps.plan.outputs.required }}
      complete: ${{ steps.plan.outputs.complete }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the pinned controller Python
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: python
      - name: Select declared installed groups
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m scripts.qualification_ci plan --event "$EVENT_NAME" \
            --base "$BASE_REVISION" --head "$HEAD_REVISION"

  ansible-m3-8:
    name: Ansible installed ${{ matrix.case }}
    needs: [installed-selection, pre-commit, python, python-recovery, m3-archive-storage]
    if: needs.installed-selection.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: >-
      ${{ contains(fromJSON('["combined-reconstruction","production-rollout"]'), matrix.case) && 90 ||
          contains(fromJSON('["core","archive-cycles","backup-mutation-overlap","restore-reconstruction","restore-tls-bootstrap"]'), matrix.case) && 60 ||
          45 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.installed-selection.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just python uv
      - name: Load the tested local storage fixture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: minio-fixture
          path: ${{ runner.temp }}/minio-fixture
      - name: Import the fixture image
        run: docker image load --input "$RUNNER_TEMP/minio-fixture/minio-fixture.tar"
      - name: Check the selected installed group
        env:
          QUALIFICATION_CASE: ${{ matrix.case }}
          LDP_QUALIFICATION_TIMING_DIRECTORY: ${{ runner.temp }}/ldp-installed
        run: just check-installed-group "$QUALIFICATION_CASE"
      - name: Retain required installed completion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-result-${{ matrix.case }}
          path: ${{ runner.temp }}/ldp-installed/case.json
          if-no-files-found: error
          retention-days: 30
      - name: Snapshot interrupted installed timing
        if: always()
        continue-on-error: true
        run: python -m scripts.qualification_timing interrupted "$RUNNER_TEMP/ldp-installed"
      - name: Retain allowlisted installed diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-diagnostics-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/ldp-installed/timing.json
            ${{ runner.temp }}/ldp-installed/timing.txt
            ${{ runner.temp }}/ldp-installed/timing-interrupted.json
            ${{ runner.temp }}/ldp-installed/failure.json
          if-no-files-found: ignore
          retention-days: 30

  ansible-complete:
    name: Ansible complete journey
    needs: [installed-selection, pre-commit, python, python-recovery, m3-archive-storage]
    if: needs.installed-selection.outputs.complete == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just python uv
      - name: Load the tested local storage fixture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: minio-fixture
          path: ${{ runner.temp }}/minio-fixture
      - name: Import the fixture image
        run: docker image load --input "$RUNNER_TEMP/minio-fixture/minio-fixture.tar"
      - name: Check the complete production-policy journey
        env:
          LDP_QUALIFICATION_TIMING_DIRECTORY: ${{ runner.temp }}/ldp-complete
        run: just check-ansible-m3-8
      - name: Snapshot interrupted complete-journey timing
        if: always()
        continue-on-error: true
        run: python -m scripts.qualification_timing interrupted "$RUNNER_TEMP/ldp-complete"
      - name: Retain allowlisted complete-journey diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: complete-journey-diagnostics
          path: |
            ${{ runner.temp }}/ldp-complete/timing.json
            ${{ runner.temp }}/ldp-complete/timing.txt
            ${{ runner.temp }}/ldp-complete/timing-interrupted.json
            ${{ runner.temp }}/ldp-complete/failure.json
          if-no-files-found: ignore
          retention-days: 30

  ansible:
    name: Ansible
    if: always()
    needs: [ansible-static, installed-selection, ansible-m3-8, ansible-complete]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned controller Python
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: python
      - name: Collect selected installed completion receipts
        if: needs.installed-selection.outputs.required == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installed-result-*
          path: ${{ runner.temp }}/installed-results
      - name: Require every selected check and its completion receipt
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTION_RESULT: ${{ needs.installed-selection.result }}
          INSTALLED_SELECTION: ${{ needs.installed-selection.outputs.selection }}
          STATIC_RESULT: ${{ needs.ansible-static.result }}
          MATRIX_RESULT: ${{ needs.ansible-m3-8.result }}
          COMPLETE_RESULT: ${{ needs.ansible-complete.result }}
          RESULT_DIRECTORY: ${{ runner.temp }}/installed-results
        run: |
          test "$SELECTION_RESULT" = success
          python -m scripts.qualification_ci verify --event "$EVENT_NAME" \
            --directory "$RESULT_DIRECTORY"

  actions:
    name: Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just github:rhysd/actionlint
      - name: Check GitHub Actions
        run: just check-actions

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: just github:gitleaks/gitleaks
      - name: Scan for secrets
        run: just check-secrets

  gate:
    name: Gate
    if: always()
    needs: [pre-commit, links, python, python-recovery, m3-contract-spine, m3-qualification, m3-archive-storage, cloudflare-networks, opentofu, ansible, actions, secrets]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation job
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* || "$RESULTS" == *skipped* ]]; then
            exit 1
          fi
          echo "All required validation jobs passed."
