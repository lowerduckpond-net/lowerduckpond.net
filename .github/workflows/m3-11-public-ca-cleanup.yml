---
name: M3.11 isolated public CA cleanup
run-name: M3.11 isolated public CA ${{ inputs.operation || 'reconcile' }}

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Validate a public candidate, confirm its manifest, or reconcile three owned tokens
        type: choice
        options: [validate, confirm, reconcile, cleanup]
        default: reconcile
      manifest:
        description: Public candidate JSON for GET-only validation; other operations use the installed variable
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: m3-11-public-ca-cleanup
  cancel-in-progress: false

jobs:
  isolation:
    if: github.ref == 'refs/heads/main' && (vars.M3_11_PUBLIC_CA_MANIFEST != '' || inputs.manifest != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: m3-11-credential-cleanup
    steps:
      - name: Select the exact public diagnostic manifest
        id: selection
        env:
          OPERATION: ${{ inputs.operation || 'reconcile' }}
          ACTIVE_MANIFEST: ${{ vars.M3_11_PUBLIC_CA_MANIFEST }}
          CANDIDATE_MANIFEST: ${{ inputs.manifest || '' }}
        run: |
          python3 - <<'PY'
          import json, os, re
          operation = os.environ['OPERATION']
          if operation not in {'validate', 'confirm', 'reconcile', 'cleanup'}:
              raise SystemExit('Unsupported diagnostic operation')
          candidate = os.environ['CANDIDATE_MANIFEST']
          if candidate and operation != 'validate':
              raise SystemExit('Only validation accepts a candidate manifest')
          raw = candidate if operation == 'validate' else os.environ['ACTIVE_MANIFEST']
          if not raw or len(raw.encode()) > 128 * 1024:
              raise SystemExit('Exact public manifest is missing or too large')
          value = json.loads(raw)
          if (not isinstance(value, dict)
              or value.get('format') != 'lowerduckpond-isolated-public-ca-manifest-v1'
              or not isinstance(value.get('intents'), list) or len(value['intents']) != 3):
              raise SystemExit('Public manifest schema differs')
          helper = value['intents'][0]['plan']['source_revision']
          if not isinstance(helper, str) or re.fullmatch('[0-9a-f]{40}', helper) is None:
              raise SystemExit('Exact helper revision is missing')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('helper=' + helper + '\n')
          PY
      - name: Check out the exact reviewed diagnostic helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.selection.outputs.helper }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require trusted main history
        env:
          HELPER: ${{ steps.selection.outputs.helper }}
          WORKFLOW_REVISION: ${{ github.sha }}
        run: git merge-base --is-ancestor "$HELPER" "$WORKFLOW_REVISION"
      - name: Install pinned tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          github_token: ${{ github.token }}
          version: 2026.8.8
          install_args: python uv
      - name: Install locked dependencies
        run: uv sync --all-packages --all-groups --frozen
      - name: Run the bounded independent diagnostic operation
        uses: ./.github/actions/m3-11-public-ca
        env:
          M3_11_CONNECT_BOOTSTRAP: ${{ secrets.M3_11_CONNECT_BOOTSTRAP }}
          M3_11_HELPER_REVISION: ${{ steps.selection.outputs.helper }}
          M3_11_PUBLIC_CA_OPERATION: ${{ inputs.operation || 'reconcile' }}
          M3_11_PUBLIC_CA_MANIFEST: ${{ inputs.operation == 'validate' && inputs.manifest || vars.M3_11_PUBLIC_CA_MANIFEST }}
      - name: Preserve only the constructed diagnostic receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-11-public-ca-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-11-public-ca/receipt.json
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve only native independent authentication
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-11-public-ca-authentication-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-11-public-ca/authentication.json
          retention-days: 30
          if-no-files-found: warn
