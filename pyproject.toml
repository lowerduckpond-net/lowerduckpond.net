[project]
name = "lowerduckpond-development"
version = "0.0.0"
description = "Development environment for the Lower Duck Pond hosting platform"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "ansible-core>=2.21.2,<2.22",
  "ansible-lint>=26.8.0,<27",
  "httpx2>=2.12.0,<3",
  "molecule>=26.6.0,<27",
  "molecule-plugins[docker]>=26.7.15,<27",
  "mypy>=1.18.0,<3",
  "pre-commit>=4.6.2,<5",
  "pytest>=9.0.0,<10",
  "pytest-testinfra>=10.2.2,<11",
  "ruff>=0.16.3,<0.17",
]

[tool.uv]
package = false

[tool.uv.sources]
lowerduckpond-static-contracts = { workspace = true }
lowerduckpond-static-domain = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/static-contracts",
  "packages/static-domain",
  "packages/static-host-agent",
  "services/control-plane",
  "services/provisioner",
  "tools/m3-archive-qualification",
  "tools/m3-qualification",
  "tools/static-operator",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = ["minio: exercises versioned S3 behavior against the pinned local MinIO image"]
pythonpath = ["."]
testpaths = [
  "packages/static-contracts/tests",
  "packages/static-domain/tests",
  "packages/static-host-agent/tests",
  "services/control-plane/tests",
  "services/provisioner/tests",
  "tests/infrastructure",
  "tools/m3-archive-qualification/tests",
  "tools/m3-qualification/tests",
  "tools/static-operator/tests",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "RET",
  "RUF",
  "S",
  "SIM",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"tools/m3-qualification/src/lowerduckpond_m3_qualification/cli.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
files = [
  "tests/infrastructure/test_backup_configuration_lock.py",
  "tests/infrastructure/test_backup_configuration_scope.py",
  "scripts/qualification_ci.py",
  "tests/infrastructure/test_qualification_ci.py",
  "scripts/qualification_selection.py",
  "tests/infrastructure/test_qualification_selection.py",
  "scripts/qualification_groups.py",
  "tests/infrastructure/test_qualification_groups.py",
  "scripts/qualification_group_runner.py",
  "scripts/qualification_group_case.py",
  "scripts/qualification_retirement.py",
  "scripts/qualification_retirement_probe.py",
  "scripts/qualification_restore.py",
  "scripts/qualification_restore_init.py",
  "scripts/qualification_restore_removal.py",
  "scripts/qualification_restore_probe.py",
  "tests/infrastructure/test_qualification_restore.py",
  "tests/infrastructure/test_qualification_restore_init.py",
  "tests/infrastructure/test_qualification_restore_removal.py",
  "tests/infrastructure/test_host_restore_gate.py",
  "tests/infrastructure/test_host_restore_units.py",
  "tests/infrastructure/test_qualification_retirement.py",
  "tests/infrastructure/test_qualification_removal_recovery.py",
  "tests/infrastructure/test_m3_8_correlation_pacing.py",
  "scripts/qualification_case.py",
  "tests/infrastructure/test_qualification_case.py",
  "scripts/qualification_context.py",
  "scripts/qualification_local.py",
  "tests/infrastructure/test_qualification_context.py",
  "tests/infrastructure/test_qualification_images.py",
  "scripts/qualification_failure.py",
  "scripts/qualification_probe.py",
  "tests/infrastructure/test_qualification_failure.py",
  "scripts/qualification_timing.py",
  "tests/infrastructure/test_qualification_timing.py",
  "config/ansible/plugins/callback/ldp_timing.py",
  "scripts/qualification_pytest_timing.py",
  "scripts/m3_10_policy_client.py",
  "tests/infrastructure/test_m3_10_policy_client.py",
  "tests/infrastructure/test_m3_10_convergence_order.py",
  "tests/infrastructure/test_m3_10_convergence_state.py",
  "tests/infrastructure/test_m3_10_completed_host.py",
  "tests/infrastructure/test_m3_10_retained_storage.py",
  "tests/infrastructure/test_m3_10_rollback_selection.py",
  "tests/infrastructure/test_m3_10_spaces_workflow.py",
  "tests/infrastructure/test_m3_10_host_firewall.py",
  "scripts/check_m3_10_host_firewall.py",
  "scripts/check_m3_10_provider.py",
  "scripts/m3_10_qualification_report.py",
  "tests/infrastructure/test_m3_10_production_gate.py",
  "tests/infrastructure/test_m3_10_qualification_report.py",
  "packages/static-contracts/src",
  "packages/static-contracts/tests",
  "packages/static-domain/src",
  "packages/static-domain/tests",
  "packages/static-host-agent/src",
  "packages/static-host-agent/tests",
  "services/control-plane/src",
  "services/control-plane/tests",
  "services/provisioner/src",
  "services/provisioner/tests",
  "tools/m3-archive-qualification/src",
  "tools/m3-archive-qualification/tests",
  "tools/m3-qualification/src",
  "tools/m3-qualification/tests",
  "tools/static-operator/src",
  "tools/static-operator/tests",
]
