---
all:
  children:
    qualification_nodes:
      hosts:
        m3_qualification:
          ansible_host: >-
            {{ lookup('ansible.builtin.env', 'M3_QUALIFICATION_EXPECTED_IPV4') }}
          m3_expected_ipv4: >-
            {{ lookup('ansible.builtin.env', 'M3_QUALIFICATION_EXPECTED_IPV4') }}
          m3_expected_droplet_id: >-
            {{ lookup('ansible.builtin.env', 'M3_QUALIFICATION_EXPECTED_DROPLET_ID') }}
          m3_expected_run_id: >-
            {{ lookup('ansible.builtin.env', 'M3_QUALIFICATION_EXPECTED_RUN_ID') }}
          m3_expected_source_revision: >-
            {{ lookup('ansible.builtin.env', 'M3_QUALIFICATION_EXPECTED_SOURCE_REVISION') }}
          m3_expected_admin_source_cidrs: >-
            {{ lookup('ansible.builtin.env', 'M3_QUALIFICATION_EXPECTED_ADMIN_SOURCE_CIDRS_JSON')
               | from_json }}
          ansible_user: ldp-admin
