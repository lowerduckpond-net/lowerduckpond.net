---
- name: Stage a restrictive qualification package source fixture
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    m3_qualification_molecule_source_root: /tmp/lowerduckpond-m3-controller-source
  tasks:
    - name: Create the restrictive controller source directory
      ansible.builtin.file:
        path: "{{ m3_qualification_molecule_source_root }}"
        state: directory
        mode: "0700"

    - name: Copy the controller source fixture with restrictive modes
      ansible.builtin.copy:
        src: >-
          {{ playbook_dir }}/../../../../tools/m3-qualification/src/lowerduckpond_m3_qualification/
        dest: "{{ m3_qualification_molecule_source_root }}/"
        mode: "0600"
        directory_mode: "0700"

    - name: Inspect the restrictive controller package fixture
      ansible.builtin.stat:
        path: "{{ m3_qualification_molecule_source_root }}/__init__.py"
      register: m3_qualification_molecule_source

    - name: Require the controller package fixture to reproduce the live failure
      ansible.builtin.assert:
        that:
          - m3_qualification_molecule_source.stat.isreg
          - m3_qualification_molecule_source.stat.mode == '0600'
        fail_msg: The Molecule controller source must reproduce a restrictive checkout.

- name: Import the hosting-node playbook
  ansible.builtin.import_playbook: ../../playbooks/site.yml

- name: Run the standalone host acceptance playbook
  ansible.builtin.import_playbook: ../../playbooks/acceptance.yml

- name: Install the isolated Milestone 3 qualification sudo boundary
  hosts: hosting_nodes
  become: true
  gather_facts: false
  vars:
    cloudflare_ipv4_cidrs:
      - 192.0.2.0/24
    cloudflare_ipv6_cidrs:
      - 2001:db8::/32
    m3_qualification_log_path: /tmp/lowerduckpond-m3-qualification-repair.json
    m3_qualification_molecule_cloudflare_token: "{{ '0' * 40 }}"
    m3_qualification_package_source_root: /tmp/lowerduckpond-m3-controller-source
    m3_qualification_validator_log_path: /tmp/lowerduckpond-m3-qualification.json
    m3_qualification_origin_pull_ca_paths:
      - /tmp/lowerduckpond-m3-origin-pull-ca.pem
    m3_qualification_static_root: /tmp/lowerduckpond-m3-static
  tasks:
    - name: Include the qualification sudo tasks
      ansible.builtin.include_role:
        name: m3_qualification
        tasks_from: sudo.yml

    - name: Include the qualification package tasks
      ansible.builtin.include_role:
        name: m3_qualification
        tasks_from: package.yml

    - name: Install the qualification fixture unit
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/m3_qualification/templates/ldp-m3-fixture.service.j2"
        dest: /etc/systemd/system/ldp-m3-fixture.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd for M3 qualification

    - name: Flush qualification package and unit handlers
      ansible.builtin.meta: flush_handlers

    - name: Enable and start the qualification fixture
      ansible.builtin.systemd_service:
        name: ldp-m3-fixture.service
        enabled: true
        state: started

    - name: Create a disposable origin-pull CA for Caddy validation  # noqa command-instead-of-module
      ansible.builtin.command:
        argv:
          - /usr/bin/openssl
          - req
          - -x509
          - -newkey
          - rsa:2048
          - -nodes
          - -keyout
          - /tmp/lowerduckpond-m3-origin-pull-ca-key.pem
          - -out
          - /tmp/lowerduckpond-m3-origin-pull-ca.pem
          - -subj
          - /CN=Lower Duck Pond Molecule origin-pull CA
          - -addext
          - basicConstraints=critical,CA:TRUE
          - -addext
          - keyUsage=critical,keyCertSign,cRLSign
          - -days
          - "1"
        creates: /tmp/lowerduckpond-m3-origin-pull-ca.pem

    - name: Inspect the qualification validation log fixture
      ansible.builtin.stat:
        path: "{{ m3_qualification_log_path }}"
        follow: false
      register: m3_qualification_validation_log_fixture

    - name: Reproduce a root-validator-created qualification log
      ansible.builtin.copy:
        content: ""
        dest: "{{ m3_qualification_log_path }}"
        owner: root
        group: root
        mode: "0600"
      when: not m3_qualification_validation_log_fixture.stat.exists

    - name: Apply the qualification log ownership contract
      ansible.builtin.include_role:
        name: m3_qualification
        tasks_from: log.yml

    - name: Render the qualification Caddy configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/m3_qualification/templates/Caddyfile.j2"
        dest: /tmp/lowerduckpond-m3-Caddyfile
        owner: root
        group: root
        mode: "0600"
      vars:
        m3_qualification_log_path: "{{ m3_qualification_validator_log_path }}"

    - name: Remove the prior service-identity validation log
      ansible.builtin.file:
        path: "{{ m3_qualification_validator_log_path }}"
        state: absent
      changed_when: false

    - name: Validate the qualification Caddy configuration as the service identity
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/lowerduckpond/caddy-validate
          - /tmp/lowerduckpond-m3-Caddyfile
      environment:
        CLOUDFLARE_API_TOKEN: "{{ m3_qualification_molecule_cloudflare_token }}"
      changed_when: false
