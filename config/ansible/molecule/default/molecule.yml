---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: lowerduckpond-ubuntu-2604
    image: ubuntu:26.04
    groups:
      - hosting_nodes
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    command: /sbin/init
    tmpfs:
      - /run
      - /run/lock
      - /tmp
provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles
      remote_tmp: /tmp/.ansible-molecule
  inventory:
    group_vars:
      hosting_nodes:
        firewall_admin_source_cidrs:
          - 192.0.2.0/24
        base_start_time_synchronization: false
        firewall_enable_service: false
        caddy_cloudflare_api_token: "molecule-cloudflare-token-\u0024RANDOM-\u0024(false)-'example"
        caddy_domain: lowerduckpond.test
        caddy_tls_mode: internal
        caddy_generation_enabled: false
        caddy_origin_pull_ca_paths:
          - /tmp/not-used-by-legacy-molecule.pem
        podman_cgroup_manager: cgroupfs
        backup_repository: /mnt/lowerduckpond-restic-test
        backup_restic_password: "molecule-restic-password-\u0024RANDOM-\u0024(false)-'0000000000"
        backup_spaces_access_key_id: molecule-spaces-access-key
        backup_spaces_secret_access_key: molecule-spaces-secret-key
        backup_spaces_region: us-east-1
        backup_node_name: molecule
verifier:
  name: testinfra
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
