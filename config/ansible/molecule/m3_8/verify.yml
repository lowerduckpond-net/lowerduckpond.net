---
- name: Run disposable M3.8 through M3.10 installed-host qualification
  hosts: localhost
  gather_facts: false
  vars:
    m3_8_qualification_host: "{{ groups['hosting_nodes'] | first }}"
  tasks:
    - name: Verify isolated storage credentials before the paced lifecycle groups
      ansible.builtin.command:
        cmd: >-
          python -m pytest --verbose
          --hosts=docker://{{ m3_8_qualification_host }}
          tests/test_archive_lifecycle.py::test_installed_tls_storage_credentials_are_mutually_denied
      args:
        chdir: >-
          {{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}
      changed_when: false
      when: lookup('ansible.builtin.env', 'M3_10_ARCHIVE_BACKEND') != 'spaces'

    - name: Prove the installed archive credential boundary before lifecycle mutations
      ansible.builtin.command:
        cmd: >-
          python -m pytest --verbose
          --hosts=docker://{{ m3_8_qualification_host }}
          tests/test_archive_credentials.py
      args:
        chdir: >-
          {{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}
      changed_when: false

    - name: Execute the installed core lifecycle before reboot
      ansible.builtin.command:
        cmd: >-
          python -m pytest --verbose
          --hosts=docker://{{ m3_8_qualification_host }}
          tests/test_lifecycle.py
      args:
        chdir: >-
          {{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}
      changed_when: false

    - name: Qualify installed export and portable import before reboot
      ansible.builtin.command:
        cmd: >-
          python -m pytest --verbose
          --hosts=docker://{{ m3_8_qualification_host }}
          tests/test_export_import.py
      args:
        chdir: >-
          {{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}
      changed_when: false

    - name: Qualify the complete installed remote archive lifecycle
      ansible.builtin.command:
        cmd: >-
          python -m pytest --verbose
          --hosts=docker://{{ m3_8_qualification_host }}
          tests/test_archive_lifecycle.py::test_installed_archive_export_restore_rearchive_and_delete
      args:
        chdir: >-
          {{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}
      changed_when: false

    - name: Qualify installed ordinary and emergency deletion
      ansible.builtin.command:
        cmd: >-
          python -m pytest --verbose
          --hosts=docker://{{ m3_8_qualification_host }}
          tests/test_deletion.py
      args:
        chdir: >-
          {{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}
      changed_when: false

    - name: Capture exact durable state before reboot
      ansible.builtin.command:
        cmd: >-
          python -m pytest --verbose
          --hosts=docker://{{ m3_8_qualification_host }}
          tests/test_reboot.py::test_capture_installed_reboot_state
      args:
        chdir: >-
          {{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}
      changed_when: false

    - name: Capture the pre-reboot reconciliation invocation
      ansible.builtin.command:
        cmd: >-
          docker exec {{ m3_8_qualification_host }}
          systemctl show --property=InvocationID --value
          lowerduckpond-static-reconcile.service
      register: m3_8_pre_reboot_reconcile_invocation
      changed_when: false
      failed_when:
        - m3_8_pre_reboot_reconcile_invocation.rc != 0 or
          not (m3_8_pre_reboot_reconcile_invocation.stdout | trim)

    - name: Reboot the disposable systemd host
      ansible.builtin.command:
        cmd: docker restart --timeout 30 {{ m3_8_qualification_host }}
      changed_when: true

    - name: Wait for immutable Caddy to return after reboot
      ansible.builtin.command:
        cmd: >-
          docker exec {{ m3_8_qualification_host }}
          systemctl is-active --quiet caddy.service
      register: m3_8_reboot_caddy
      changed_when: false
      retries: 120
      delay: 1
      until: m3_8_reboot_caddy.rc == 0

    - name: Wait for startup reconciliation to complete after reboot
      ansible.builtin.command:
        cmd: >-
          docker exec {{ m3_8_qualification_host }}
          systemctl show
          --property=ActiveState
          --property=SubState
          --property=Result
          --property=ExecMainStatus
          --property=InvocationID
          lowerduckpond-static-reconcile.service
      register: m3_8_reboot_reconcile
      changed_when: false
      retries: 120
      delay: 1
      until:
        - "'ActiveState=inactive' in m3_8_reboot_reconcile.stdout_lines"
        - "'SubState=dead' in m3_8_reboot_reconcile.stdout_lines"
        - "'Result=success' in m3_8_reboot_reconcile.stdout_lines"
        - "'ExecMainStatus=0' in m3_8_reboot_reconcile.stdout_lines"
        - >-
          ('InvocationID=' ~
           (m3_8_pre_reboot_reconcile_invocation.stdout | trim)) not in
          m3_8_reboot_reconcile.stdout_lines
        - >-
          m3_8_reboot_reconcile.stdout is
          regex('(?m)^InvocationID=[0-9a-f]+$')

    - name: Verify exact persisted state and boot recovery
      ansible.builtin.command:
        cmd: >-
          python -m pytest --verbose
          --hosts=docker://{{ m3_8_qualification_host }}
          tests/test_reboot.py::test_verify_installed_reboot_state
      args:
        chdir: >-
          {{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}
      changed_when: false

    - name: Execute installed transport and recovery qualification after reboot
      ansible.builtin.command:
        cmd: >-
          python -m pytest --verbose
          --hosts=docker://{{ m3_8_qualification_host }}
          tests/test_transport_recovery.py
      args:
        chdir: >-
          {{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}
      changed_when: false

    - name: Qualify installed quarantine recovery after journal removal
      ansible.builtin.command:
        cmd: >-
          python -m pytest --verbose
          --hosts=docker://{{ m3_8_qualification_host }}
          tests/test_quarantine_recovery.py
      args:
        chdir: >-
          {{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}
      changed_when: false

    - name: Record the artifact and exact final lifecycle accounting
      ansible.builtin.command:
        cmd: >-
          python -m pytest --verbose
          --hosts=docker://{{ m3_8_qualification_host }}
          tests/test_archive_completion.py
      args:
        chdir: >-
          {{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}
      changed_when: false
