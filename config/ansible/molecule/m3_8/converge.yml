---
- name: Build disposable M3.8 controller inputs
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    m3_10_archive_backend: >-
      {{ lookup('ansible.builtin.env', 'M3_10_ARCHIVE_BACKEND') | default('minio', true) }}
    m3_11_combined_backend: >-
      {{ lookup('ansible.builtin.env', 'M3_11_COMBINED_BACKEND') }}
    static_host_agent_molecule_artifact: >-
      {{ lookup('ansible.builtin.env', 'LDP_QUALIFICATION_ARTIFACT') |
         default('/tmp/lowerduckpond-static-host-agent-m3-8.tar', true) }}
    m3_8_origin_pull_ca_key: >-
      {{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY')
         }}/origin-pull-ca.key
    m3_8_origin_pull_ca_certificate: >-
      {{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY')
         }}/origin-pull-ca.pem
    m3_8_origin_pull_client_key: >-
      {{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY')
         }}/origin-pull-client.key
    m3_8_origin_pull_client_request: >-
      {{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY')
         }}/origin-pull-client.csr
    m3_8_origin_pull_client_certificate: >-
      {{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY')
         }}/origin-pull-client.pem
    m3_8_https_server_key: >-
      {{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY')
         }}/https-server.key
    m3_8_https_server_request: >-
      {{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY')
         }}/https-server.csr
    m3_8_https_server_certificate: >-
      {{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY')
         }}/https-server.pem
    m3_8_static_publication_enabled: >-
      {{ lookup('ansible.builtin.env', 'M3_8_STATIC_PUBLICATION_ENABLED') |
         default('false', true) | bool }}
    m3_11_backup_recovery_enabled: >-
      {{ lookup('ansible.builtin.env', 'M3_11_BACKUP_RECOVERY_ENABLED') |
         default('false', true) | bool }}
    m3_11_audit_rotation_enabled: >-
      {{ lookup('ansible.builtin.env', 'M3_11_AUDIT_ROTATION_ENABLED') |
         default('false', true) | bool }}
    m3_8_cloudflare_api_token: >-
      {{ lookup('ansible.builtin.env', 'M3_8_CLOUDFLARE_API_TOKEN') |
         default('0000000000000000000000000000000000000000', true) }}
    m3_8_docker_host: >-
      {{ lookup('ansible.builtin.env', 'DOCKER_HOST') }}
    m3_8_operator_transport_path: >-
      {{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY')
         }}/operator-transport.json
  tasks:
    - name: Require an explicitly supported archive qualification backend
      ansible.builtin.assert:
        that:
          - m3_10_archive_backend in ['minio', 'spaces']

    - name: Build the locked static host-agent artifact
      ansible.builtin.command:
        argv:
          - "{{ playbook_dir }}/../../../../scripts/build-static-host-agent"
          - "{{ static_host_agent_molecule_artifact }}"
      register: static_host_agent_molecule_build
      changed_when: false

    - name: Create a disposable origin-pull CA
      ansible.builtin.command:
        argv:
          - /usr/bin/openssl
          - req
          - -x509
          - -newkey
          - rsa:2048
          - -nodes
          - -keyout
          - "{{ m3_8_origin_pull_ca_key }}"
          - -out
          - "{{ m3_8_origin_pull_ca_certificate }}"
          - -days
          - "14"
          - -subj
          - /CN=Lower Duck Pond disposable M3.8 origin pull CA
          - -addext
          - basicConstraints=critical,CA:TRUE
          - -addext
          - keyUsage=critical,keyCertSign,cRLSign
      args:
        creates: "{{ m3_8_origin_pull_ca_certificate }}"

    - name: Create a disposable origin-pull client request
      ansible.builtin.command:
        argv:
          - /usr/bin/openssl
          - req
          - -new
          - -newkey
          - rsa:2048
          - -nodes
          - -keyout
          - "{{ m3_8_origin_pull_client_key }}"
          - -out
          - "{{ m3_8_origin_pull_client_request }}"
          - -subj
          - /CN=Lower Duck Pond disposable M3.8 origin pull client
          - -addext
          - basicConstraints=critical,CA:FALSE
          - -addext
          - keyUsage=critical,digitalSignature,keyEncipherment
          - -addext
          - extendedKeyUsage=clientAuth
      args:
        creates: "{{ m3_8_origin_pull_client_request }}"

    - name: Sign the disposable origin-pull client certificate
      ansible.builtin.command:
        argv:
          - /usr/bin/openssl
          - x509
          - -req
          - -in
          - "{{ m3_8_origin_pull_client_request }}"
          - -CA
          - "{{ m3_8_origin_pull_ca_certificate }}"
          - -CAkey
          - "{{ m3_8_origin_pull_ca_key }}"
          - -CAcreateserial
          - -days
          - "7"
          - -sha256
          - -copy_extensions
          - copy
          - -out
          - "{{ m3_8_origin_pull_client_certificate }}"
      args:
        creates: "{{ m3_8_origin_pull_client_certificate }}"

    - name: Create a disposable HTTPS server request
      ansible.builtin.command:
        argv:
          - /usr/bin/openssl
          - req
          - -new
          - -newkey
          - rsa:2048
          - -nodes
          - -keyout
          - "{{ m3_8_https_server_key }}"
          - -out
          - "{{ m3_8_https_server_request }}"
          - -subj
          - /CN=lowerduckpond.com
          - -addext
          - basicConstraints=critical,CA:FALSE
          - -addext
          - keyUsage=critical,digitalSignature,keyEncipherment
          - -addext
          - extendedKeyUsage=serverAuth
          - -addext
          - >-
            subjectAltName=DNS:lowerduckpond.com,DNS:*.lowerduckpond.com,
            DNS:lowerduckpond.net,DNS:*.lowerduckpond.net
      args:
        creates: "{{ m3_8_https_server_request }}"

    - name: Sign the disposable HTTPS server certificate
      ansible.builtin.command:
        argv:
          - /usr/bin/openssl
          - x509
          - -req
          - -in
          - "{{ m3_8_https_server_request }}"
          - -CA
          - "{{ m3_8_origin_pull_ca_certificate }}"
          - -CAkey
          - "{{ m3_8_origin_pull_ca_key }}"
          - -CAcreateserial
          - -days
          - "7"
          - -sha256
          - -copy_extensions
          - copy
          - -out
          - "{{ m3_8_https_server_certificate }}"
      args:
        creates: "{{ m3_8_https_server_certificate }}"

    - name: Protect the disposable origin-pull inputs
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0600"
      loop:
        - "{{ m3_8_origin_pull_ca_key }}"
        - "{{ m3_8_origin_pull_ca_certificate }}"
        - "{{ m3_8_origin_pull_client_key }}"
        - "{{ m3_8_origin_pull_client_request }}"
        - "{{ m3_8_origin_pull_client_certificate }}"
        - "{{ m3_8_https_server_key }}"
        - "{{ m3_8_https_server_request }}"
        - "{{ m3_8_https_server_certificate }}"

    - name: Resolve the exact controller address used for operator transport
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - "{{ playbook_dir }}/resolve_operator_transport.py"
          - "{{ m3_8_docker_host }}"
          - "{{ groups['hosting_nodes'] | first }}"
      register: m3_8_operator_transport_source
      changed_when: false

    - name: Record the exact operator transport endpoint
      ansible.builtin.copy:
        content: "{{ m3_8_operator_transport_source.stdout | trim }}\n"
        dest: "{{ m3_8_operator_transport_path }}"
        mode: "0600"

    - name: Prepare the pinned private TLS archive fixture without removing objects
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - "{{ playbook_dir }}/prepare_archive_storage.py"
          - "{{ groups['archive_fixture'] | first }}"
          - "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/archive-tls"
      register: m3_10_archive_storage
      changed_when: false
      when: m3_10_archive_backend == 'minio'

    - name: Attach the pinned artifact to the installed host
      ansible.builtin.add_host:
        name: "{{ item }}"
        caddy_origin_pull_ca_paths:
          - "{{ m3_8_origin_pull_ca_certificate }}"
        m3_10_archive_storage: "{{ m3_10_archive_storage.stdout | default('{}') | from_json }}"
        static_host_agent_artifact_path: >-
          {{ static_host_agent_molecule_artifact }}
        static_host_agent_artifact_sha256: >-
          {{ static_host_agent_molecule_build.stdout | trim }}
        static_publication_enabled: >-
          {{ m3_8_static_publication_enabled }}
        backup_static_recovery_enabled: >-
          {{ m3_11_backup_recovery_enabled }}
        backup_audit_rotation_enabled: >-
          {{ m3_11_audit_rotation_enabled }}
        caddy_cloudflare_api_token: >-
          {{ m3_8_cloudflare_api_token }}
        firewall_admin_source_cidrs:
          - >-
            {{ (m3_8_operator_transport_source.stdout | from_json).sourceCidr }}
        m3_8_origin_pull_client_key: >-
          {{ m3_8_origin_pull_client_key }}
        m3_8_origin_pull_client_certificate: >-
          {{ m3_8_origin_pull_client_certificate }}
        m3_8_https_server_key: >-
          {{ m3_8_https_server_key }}
        m3_8_https_server_certificate: >-
          {{ m3_8_https_server_certificate }}
      loop: "{{ groups['hosting_nodes'] }}"
      changed_when: false

    - name: Require explicit live storage for combined qualification
      ansible.builtin.assert:
        that:
          - m3_11_combined_backend in ['', 'spaces']
          - m3_11_combined_backend != 'spaces' or m3_10_archive_backend == 'spaces'

    - name: Load owned combined storage through a temporary private file
      when: m3_11_combined_backend == 'spaces'
      block:
        - name: Validate the owned combined backup repository and private inputs
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - -m
              - scripts.m3_11_live_storage
              - --variables-file
            chdir: "{{ playbook_dir }}/../../../.."
          register: m3_11_live_storage
          changed_when: false
          no_log: true

        - name: Read the private combined storage variables without logging their contents
          ansible.builtin.include_vars:
            file: "{{ m3_11_live_storage.stdout | trim }}"
            name: m3_11_storage_inputs
          no_log: true
      always:
        - name: Remove temporary combined storage credential material
          ansible.builtin.file:
            path: "{{ m3_11_live_storage.stdout | trim }}"
            state: absent
          when: m3_11_live_storage.stdout | default('') | trim | length > 0
          changed_when: false
          no_log: true

    - name: Attach the owned combined backup repository to the disposable source
      ansible.builtin.add_host:
        name: "{{ item }}"
        backup_repository: "{{ m3_11_storage_inputs.backup_repository }}"
        backup_restic_password: "{{ m3_11_storage_inputs.backup_restic_password }}"
        backup_spaces_access_key_id: "{{ m3_11_storage_inputs.backup_spaces_access_key_id }}"
        backup_spaces_secret_access_key: "{{ m3_11_storage_inputs.backup_spaces_secret_access_key }}"
        backup_spaces_region: "{{ m3_11_storage_inputs.backup_spaces_region }}"
        backup_node_name: "{{ m3_11_storage_inputs.backup_node_name }}"
      loop: "{{ groups['hosting_nodes'] }}"
      changed_when: false
      no_log: true
      when: m3_11_combined_backend == 'spaces'

    - name: Attach only the dedicated live archive credential to the disposable host
      ansible.builtin.add_host:
        name: "{{ item }}"
        static_host_agent_archive_configuration:
          format: lowerduckpond-archive-configuration-v1
          region: "{{ lookup('ansible.builtin.env', 'SPACES_REGION') }}"
          bucket: "{{ lookup('ansible.builtin.env', 'SPACES_ARCHIVE_BUCKET') }}"
          accessKeyId: "{{ lookup('ansible.builtin.env', 'SPACES_ARCHIVE_ACCESS_KEY_ID') }}"
          secretAccessKey: "{{ lookup('ansible.builtin.env', 'SPACES_ARCHIVE_SECRET_ACCESS_KEY') }}"
      loop: "{{ groups['hosting_nodes'] }}"
      changed_when: false
      no_log: true
      when: m3_10_archive_backend == 'spaces'

- name: Prepare disposable M3.8 host inputs
  hosts: hosting_nodes
  become: true
  gather_facts: false
  vars:
    m3_8_caddy_certificate_root: >-
      /var/lib/caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory
    m3_8_caddy_certificate_names:
      - lowerduckpond.com
      - wildcard_.lowerduckpond.com
      - lowerduckpond.net
      - wildcard_.lowerduckpond.net
    m3_8_caddy_certificate_sans:
      - lowerduckpond.com
      - "*.lowerduckpond.com"
      - lowerduckpond.net
      - "*.lowerduckpond.net"
  tasks:
    - name: Read the disposable operator public key
      ansible.builtin.slurp:
        src: /run/lowerduckpond-molecule/operator-key.pub
      register: static_operator_molecule_public_key

    - name: Attach the operator identity to the installed host
      ansible.builtin.set_fact:
        static_operator_public_key: >-
          {{ static_operator_molecule_public_key.content | b64decode | trim }}
        static_operator_principal: molecule-m3-8-operator-v1

    - name: Install the disposable origin-pull client key
      ansible.builtin.copy:
        src: "{{ m3_8_origin_pull_client_key }}"
        dest: /run/lowerduckpond-molecule/origin-pull-client.key
        owner: root
        group: root
        mode: "0600"

    - name: Install the disposable origin-pull client certificate
      ansible.builtin.copy:
        src: "{{ m3_8_origin_pull_client_certificate }}"
        dest: /run/lowerduckpond-molecule/origin-pull-client.pem
        owner: root
        group: root
        mode: "0600"

    - name: Create the Caddy account before seeding disposable storage
      ansible.builtin.group:
        name: caddy
        system: true

    - name: Create the Caddy user before seeding disposable storage
      ansible.builtin.user:
        name: caddy
        group: caddy
        home: /var/lib/caddy
        shell: /usr/sbin/nologin
        system: true
        create_home: false

    - name: Create protected disposable Caddy certificate storage
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: caddy
        group: caddy
        mode: "0700"
      loop:
        - /var/lib/caddy
        - /var/lib/caddy/caddy
        - /var/lib/caddy/caddy/certificates
        - "{{ m3_8_caddy_certificate_root }}"

    - name: Create protected disposable Caddy certificate entries
      ansible.builtin.file:
        path: "{{ m3_8_caddy_certificate_root }}/{{ item }}"
        state: directory
        owner: caddy
        group: caddy
        mode: "0700"
      loop: "{{ m3_8_caddy_certificate_names }}"

    - name: Seed the disposable managed HTTPS certificate
      ansible.builtin.copy:
        src: "{{ m3_8_https_server_certificate }}"
        dest: >-
          {{ m3_8_caddy_certificate_root }}/{{ item }}/{{ item }}.crt
        owner: caddy
        group: caddy
        mode: "0600"
      loop: "{{ m3_8_caddy_certificate_names }}"

    - name: Seed the disposable managed HTTPS private key
      ansible.builtin.copy:
        src: "{{ m3_8_https_server_key }}"
        dest: >-
          {{ m3_8_caddy_certificate_root }}/{{ item }}/{{ item }}.key
        owner: caddy
        group: caddy
        mode: "0600"
      loop: "{{ m3_8_caddy_certificate_names }}"
      no_log: true

    - name: Seed the disposable managed HTTPS metadata
      ansible.builtin.copy:
        content: >-
          {{
            {
              'sans': m3_8_caddy_certificate_sans,
              'issuer_data': {
                'url': 'https://molecule.invalid/certificate',
                'ca': 'https://acme-v02.api.letsencrypt.org/directory'
              }
            } | to_nice_json
          }}
        dest: >-
          {{ m3_8_caddy_certificate_root }}/{{ item }}/{{ item }}.json
        owner: caddy
        group: caddy
        mode: "0600"
      loop: "{{ m3_8_caddy_certificate_names }}"

- name: Import the hosting-node playbook
  ansible.builtin.import_playbook: ../../playbooks/site.yml

- name: Trust and resolve only the disposable archive endpoint
  hosts: hosting_nodes
  become: true
  gather_facts: false
  tasks:
    - name: Install the disposable archive CA in the ordinary system trust store
      ansible.builtin.copy:
        src: "{{ m3_10_archive_storage.caCertificate }}"
        dest: /usr/local/share/ca-certificates/m3-10-disposable-archive.crt
        owner: root
        group: root
        mode: "0644"
      notify: Refresh disposable archive TLS trust
      when: lookup('ansible.builtin.env', 'M3_10_ARCHIVE_BACKEND') != 'spaces'

    - name: Resolve the fixed archive endpoint to the disposable TLS service
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^.* ams3\.digitaloceanspaces\.com$'
        line: "{{ m3_10_archive_storage.address }} ams3.digitaloceanspaces.com"
        unsafe_writes: true
      when: lookup('ansible.builtin.env', 'M3_10_ARCHIVE_BACKEND') != 'spaces'

  handlers:
    - name: Refresh disposable archive TLS trust
      ansible.builtin.command:
        argv:
          - /usr/sbin/update-ca-certificates
      changed_when: true

- name: Run the standalone host acceptance playbook
  ansible.builtin.import_playbook: ../../playbooks/acceptance.yml
