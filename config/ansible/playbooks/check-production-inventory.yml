---
- name: Verify production environment variable discovery
  hosts: hosting_nodes
  connection: local
  gather_facts: false
  tasks:
    - name: Resolve the standalone acceptance contract
      ansible.builtin.import_tasks: tasks/resolve-acceptance-contract.yml

    - name: Verify production variables resolve from the operator environment
      ansible.builtin.assert:
        that:
          - firewall_admin_source_cidrs == ['192.0.2.1/32']
          - backup_repository == 'inventory-test-repository'
          - caddy_cloudflare_api_token == 'inventory-test-caddy-token'
          - caddy_origin_pull_ca_paths == ['/private/origin-pull-ca.pem']
          - not caddy_origin_pull_enforcement_enabled | bool
          - backup_restic_password == 'inventory-test-restic-password'
          - backup_spaces_access_key_id == 'inventory-test-access-key'
          - backup_spaces_secret_access_key == 'inventory-test-secret-key'
          - backup_spaces_region == 'inventory-test-region'
          - static_operator_principal == 'inventory-operator-v1'
          - >-
            static_operator_public_key ==
            'ssh-ed25519
            AAAAC3NzaC1lZDI1NTE5AAAAIKvQO3bKFnR6F0kAAbB+2c5F5HLpS36uGnYS0xV9mO4O
            inventory-test'
          - acceptance_caddy_domain == 'lowerduckpond.net'
          - acceptance_caddy_tls_mode == 'cloudflare'
          - acceptance_podman_service_user == 'ldp-runtime'
          - acceptance_podman_service_uid == 21000
          - acceptance_podman_service_home == '/var/lib/lowerduckpond/runtime'
          - acceptance_backup_service_user == 'root'
        quiet: true
      no_log: true
