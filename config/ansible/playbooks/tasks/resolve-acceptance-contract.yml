---
- name: Load Caddy defaults for standalone acceptance
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../roles/caddy/defaults/main.yml"
    name: acceptance_caddy_role_defaults

- name: Load Podman defaults for standalone acceptance
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../roles/podman/defaults/main.yml"
    name: acceptance_podman_role_defaults

- name: Load backup defaults for standalone acceptance
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../roles/backup/defaults/main.yml"
    name: acceptance_backup_role_defaults

- name: Resolve the installed host contract
  ansible.builtin.set_fact:
    acceptance_caddy_domain: >-
      {{ caddy_domain |
      default(acceptance_caddy_role_defaults.caddy_domain) }}
    acceptance_caddy_tls_mode: >-
      {{ caddy_tls_mode |
      default(acceptance_caddy_role_defaults.caddy_tls_mode) }}
    acceptance_podman_service_user: >-
      {{ podman_service_user |
      default(acceptance_podman_role_defaults.podman_service_user) }}
    acceptance_podman_service_uid: >-
      {{ podman_service_uid |
      default(acceptance_podman_role_defaults.podman_service_uid) }}
    acceptance_podman_service_home: >-
      {{ podman_service_home |
      default(acceptance_podman_role_defaults.podman_service_home) }}
    acceptance_backup_service_user: >-
      {{ backup_service_user |
      default(acceptance_backup_role_defaults.backup_service_user) }}
