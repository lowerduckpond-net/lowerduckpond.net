---
- name: Verify Lower Duck Pond hosting nodes
  hosts: hosting_nodes
  become: true
  gather_facts: false
  pre_tasks:
    - name: Resolve the installed host contract
      ansible.builtin.import_tasks: tasks/resolve-acceptance-contract.yml

  tasks:
    - name: Validate the installed legacy Caddy configuration
      ansible.builtin.command:
        cmd: /usr/local/libexec/lowerduckpond/caddy-validate /etc/caddy/Caddyfile
      changed_when: false
      no_log: true
      when: not acceptance_caddy_generation_enabled | bool

    - name: Validate the selected complete platform-only Caddy generation
      ansible.builtin.command:
        cmd: /usr/local/libexec/lowerduckpond/check-caddy-generation
      register: acceptance_platform_caddy_generation
      changed_when: false
      failed_when: >-
        acceptance_platform_caddy_generation.rc != 0 or
        acceptance_platform_caddy_generation.stdout | trim != 'unchanged'
      when:
        - acceptance_caddy_generation_enabled | bool
        - not static_publication_enabled | bool

    - name: Validate the selected tenant-capable Caddy generation
      ansible.builtin.command:
        cmd: /usr/local/libexec/lowerduckpond/check-current-caddy-generation
      register: acceptance_tenant_caddy_generation
      changed_when: false
      failed_when: >-
        acceptance_tenant_caddy_generation.rc != 0 or
        acceptance_tenant_caddy_generation.stdout | trim != 'current'
      when:
        - acceptance_caddy_generation_enabled | bool
        - static_publication_enabled | bool

    - name: Verify the HTTPS fixture locally  # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: >-
          curl --fail --silent --show-error
          {{ '--insecure' if acceptance_caddy_tls_mode == 'internal' else '' }}
          --resolve {{ acceptance_caddy_domain }}:443:127.0.0.1
          https://{{ acceptance_caddy_domain }}/
      register: acceptance_https_fixture
      changed_when: false
      failed_when: '"Lower Duck Pond Hosting" not in acceptance_https_fixture.stdout'
      when: not acceptance_caddy_generation_enabled | bool

    - name: Read public TCP listeners
      ansible.builtin.command:
        cmd: /usr/local/libexec/lowerduckpond/public-tcp-listeners
      register: acceptance_public_tcp_listeners
      changed_when: false

    - name: Verify only intended ports listen publicly
      ansible.builtin.assert:
        that:
          - >-
            acceptance_public_tcp_listeners.stdout_lines |
            map('regex_replace', '^.*:', '') |
            difference(['22', '80', '443']) |
            length == 0
          - >-
            '80' in (acceptance_public_tcp_listeners.stdout_lines |
            map('regex_replace', '^.*:', '') | list)
          - >-
            '443' in (acceptance_public_tcp_listeners.stdout_lines |
            map('regex_replace', '^.*:', '') | list)

    - name: Verify the Caddy admin API has no TCP listener
      ansible.builtin.shell:
        cmd: ss --no-header --listening --numeric --tcp 'sport = :2019'
        executable: /bin/bash
      register: acceptance_caddy_admin_tcp_listener
      changed_when: false
      failed_when: acceptance_caddy_admin_tcp_listener.stdout | length > 0

    - name: Verify the installed Caddy unit contract
      ansible.builtin.command:
        argv:
          - /usr/bin/systemd-analyze
          - verify
          - --recursive-errors=no
          - /etc/systemd/system/caddy.service
      changed_when: false

    - name: Verify MariaDB accepts only local connections
      ansible.builtin.command:
        cmd: mariadb --batch --skip-column-names --execute "SELECT @@bind_address"
      register: acceptance_mariadb_bind_address
      changed_when: false
      failed_when: acceptance_mariadb_bind_address.stdout | trim != "127.0.0.1"

    - name: Verify rootless Podman for the runtime account
      ansible.builtin.command:
        cmd: podman info --format json
      become_user: "{{ acceptance_podman_service_user }}"
      become: true
      environment:
        HOME: "{{ acceptance_podman_service_home }}"
        XDG_RUNTIME_DIR: "/run/user/{{ acceptance_podman_service_uid }}"
      changed_when: false

    - name: Resolve the selected static host-agent artifact
      ansible.builtin.command:
        argv:
          - /usr/bin/readlink
          - --canonicalize-existing
          - /opt/lowerduckpond/static-host-agent/current
      register: acceptance_static_host_agent
      changed_when: false
      failed_when: >-
        acceptance_static_host_agent.stdout | trim !=
        '/opt/lowerduckpond/static-host-agent/' ~
        static_host_agent_artifact_sha256

    - name: Verify the selected static host-agent artifact
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/lowerduckpond/verify-static-host-agent-artifact
          - >-
            /opt/lowerduckpond/static-host-agent/{{
            static_host_agent_artifact_sha256 }}
      changed_when: false

    - name: Verify static job issuance matches the configured boundary
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/lowerduckpond/static-publication-gate
          - job-issuance
      register: acceptance_static_job_gate
      changed_when: false
      failed_when: >-
        (static_publication_enabled | bool and
         acceptance_static_job_gate.rc != 0) or
        (not static_publication_enabled | bool and
         (acceptance_static_job_gate.rc != 78 or
          acceptance_static_job_gate.stderr | trim != 'publication_disabled'))

    - name: Inspect active tenant route inputs
      ansible.builtin.find:
        paths: /etc/caddy/routes.d
        hidden: true
        recurse: true
        file_type: any
      register: acceptance_static_routes
      when: not acceptance_caddy_generation_enabled | bool

    - name: Verify the configured static publication boundary
      ansible.builtin.assert:
        that:
          - >-
            static_publication_enabled | bool or
            acceptance_caddy_generation_enabled | bool or
            acceptance_static_routes.matched == 0

    - name: Verify the static worker unit contract
      ansible.builtin.command:
        argv:
          - /usr/bin/systemd-analyze
          - verify
          - --recursive-errors=no
          - /etc/systemd/system/lowerduckpond-static-worker@.service
      changed_when: false

    - name: Verify the encrypted Restic repository
      ansible.builtin.command:
        cmd: /usr/local/libexec/lowerduckpond/restic-check
      become_user: "{{ acceptance_backup_service_user }}"
      become: true
      changed_when: false
      no_log: true

    - name: Exercise a disposable restore
      ansible.builtin.command:
        cmd: /usr/local/libexec/lowerduckpond/restore-smoke-test
      become_user: "{{ acceptance_backup_service_user }}"
      become: true
      changed_when: false
      no_log: true

    - name: Verify required system services are enabled  # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: "systemctl is-enabled {{ item }}"
      loop:
        - caddy.service
        - chrony.service
        - mariadb.service
        - nftables.service
        - prometheus-node-exporter.service
        - lowerduckpond-backup.timer
        - lowerduckpond-backup-maintenance.timer
        - lowerduckpond-health.timer
      changed_when: false

    - name: Verify the rootless readiness service is enabled  # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: systemctl --user is-enabled lowerduckpond-podman-ready.service
      become_user: "{{ acceptance_podman_service_user }}"
      become: true
      environment:
        DBUS_SESSION_BUS_ADDRESS: >-
          unix:path=/run/user/{{ acceptance_podman_service_uid }}/bus
        HOME: "{{ acceptance_podman_service_home }}"
        XDG_RUNTIME_DIR: "/run/user/{{ acceptance_podman_service_uid }}"
      changed_when: false
