---
- name: Require the exact Milestone 3 qualification inventory
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tasks:
    - name: Require exactly one state-bound qualification target
      ansible.builtin.assert:
        that:
          - groups['qualification_nodes'] | default([]) == ['m3_qualification']
          - >-
            hostvars['m3_qualification'].ansible_host ==
            lookup('ansible.builtin.env', 'M3_QUALIFICATION_EXPECTED_IPV4')
          - >-
            hostvars['m3_qualification'].m3_expected_ipv4 ==
            lookup('ansible.builtin.env', 'M3_QUALIFICATION_EXPECTED_IPV4')
          - >-
            hostvars['m3_qualification'].m3_expected_droplet_id ==
            lookup('ansible.builtin.env', 'M3_QUALIFICATION_EXPECTED_DROPLET_ID')
          - >-
            hostvars['m3_qualification'].m3_expected_run_id ==
            lookup('ansible.builtin.env', 'M3_QUALIFICATION_EXPECTED_RUN_ID')
          - >-
            hostvars['m3_qualification'].m3_expected_source_revision ==
            lookup('ansible.builtin.env', 'M3_QUALIFICATION_EXPECTED_SOURCE_REVISION')
          - >-
            hostvars['m3_qualification'].m3_expected_admin_source_cidrs ==
            (lookup('ansible.builtin.env',
                    'M3_QUALIFICATION_EXPECTED_ADMIN_SOURCE_CIDRS_JSON') | from_json)
        fail_msg: >-
          Refusing to configure without the exact state-bound M3.0 qualification target.
        quiet: true
      tags:
        - m3_qualification_inventory_preflight

    - name: Attest the exact qualification inventory
      ansible.builtin.set_fact:
        m3_qualification_inventory_preflight_passed: true
      tags:
        - m3_qualification_inventory_preflight

- name: Configure the disposable Milestone 3 qualification host
  hosts: qualification_nodes
  become: true
  gather_facts: false
  vars_files:
    - ../../../platform/versions.yml
    - ../../../platform/cloudflare-networks.json
  vars:
    caddy_domain: m3-qualification.lowerduckpond.net
    caddy_tls_mode: internal
    caddy_generation_enabled: false
    firewall_admin_source_cidrs: "{{ m3_expected_admin_source_cidrs }}"
    firewall_web_source_cidrs: >-
      {{ cloudflare_ipv4_cidrs + cloudflare_ipv6_cidrs }}
    m3_qualification_convergence_marker: /var/lib/lowerduckpond-m3/converged-session
    caddy_cloudflare_api_token: >-
      {{ lookup('ansible.builtin.env', 'M3_QUALIFICATION_CLOUDFLARE_API_TOKEN') }}
    m3_qualification_origin_pull_trust: >-
      {{ lookup('ansible.builtin.env', 'M3_QUALIFICATION_ORIGIN_PULL_TRUST') }}
    m3_qualification_origin_pull_primary_ca_path: >-
      {{ lookup('ansible.builtin.env', 'M3_QUALIFICATION_PRIMARY_CA_PATH') }}
    m3_qualification_origin_pull_replacement_ca_path: >-
      {{ lookup('ansible.builtin.env', 'M3_QUALIFICATION_REPLACEMENT_CA_PATH') }}
  pre_tasks:
    - name: Require successful controller inventory preflight
      ansible.builtin.assert:
        that:
          - >-
            hostvars['localhost'].m3_qualification_inventory_preflight_passed |
            default(false) | bool
        fail_msg: >-
          Refusing remote access without a successful M3.0 inventory preflight.
        quiet: true
      tags:
        - always
        - m3_qualification_remote_preflight_gate

    - name: Read the connected Droplet identity from DigitalOcean metadata
      ansible.builtin.uri:
        url: http://169.254.169.254/metadata/v1/id
        return_content: true
        status_code: 200
        timeout: 2
        use_proxy: false
      register: m3_qualification_metadata_id
      changed_when: false

    - name: Require the exact OpenTofu-created qualification Droplet
      ansible.builtin.assert:
        that:
          - m3_expected_droplet_id is match('^[0-9]+$')
          - m3_qualification_metadata_id.content | trim == m3_expected_droplet_id
          - ansible_host == m3_expected_ipv4
          - >-
            m3_expected_run_id is
            match('^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$')
          - m3_expected_source_revision is match('^[0-9a-f]{40}$')
          - m3_expected_admin_source_cidrs | length > 0
          - "'0.0.0.0/0' not in m3_expected_admin_source_cidrs"
          - "'::/0' not in m3_expected_admin_source_cidrs"
        fail_msg: Refusing to configure a host not bound to the M3.0 OpenTofu session.

    - name: Gather facts after qualification identity verification
      ansible.builtin.setup:

    - name: Require the production-equivalent Ubuntu release
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == platform_versions.host_os_distribution
          - ansible_facts.distribution_version == platform_versions.host_os_release
        fail_msg: M3.0 qualification requires a real Ubuntu 26.04 host.

    - name: Require the temporary dual-zone Caddy token
      ansible.builtin.assert:
        that:
          - caddy_cloudflare_api_token | length >= 20
        fail_msg: >-
          Export M3_QUALIFICATION_CLOUDFLARE_API_TOKEN with DNS edit access limited
          to the lowerduckpond.net and lowerduckpond.com zones.
        quiet: true
      no_log: true

    - name: Require an exact origin-pull trust stage and controller CA inputs
      ansible.builtin.assert:
        that:
          - m3_qualification_origin_pull_trust in ['dual', 'replacement']
          - m3_qualification_origin_pull_primary_ca_path | length > 0
          - m3_qualification_origin_pull_replacement_ca_path | length > 0
        fail_msg: >-
          Export both public project-CA paths and select the dual or replacement trust stage.
        quiet: true

    - name: Invalidate any prior qualification convergence
      ansible.builtin.file:
        path: "{{ m3_qualification_convergence_marker }}"
        state: absent
  roles:
    - role: base
    - role: firewall
    - role: caddy
    - role: m3_qualification
  post_tasks:
    - name: Flush every handler before attesting convergence
      ansible.builtin.meta: flush_handlers

    - name: Attest successful qualification convergence
      ansible.builtin.include_role:
        name: m3_qualification
        tasks_from: convergence.yml
