---
- name: Install the qualification sudo boundary
  ansible.builtin.import_tasks: sudo.yml

- name: Create root-owned qualification directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ m3_qualification_install_root }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ m3_qualification_state_root }}"
      owner: root
      group: root
      mode: "0700"
    - path: /etc/caddy/qualification
      owner: root
      group: caddy
      mode: "0750"
    - path: "{{ m3_qualification_generation_root }}"
      owner: root
      group: caddy
      mode: "0750"
    - path: "{{ m3_qualification_static_root }}"
      owner: root
      group: caddy
      mode: "0750"

- name: Inspect the run-specific Caddy generation directory
  ansible.builtin.stat:
    path: "{{ m3_qualification_generation_root }}/{{ m3_qualification_generation }}"
    follow: false
  register: m3_qualification_generation_directory

- name: Require a safe existing run-specific generation directory
  ansible.builtin.assert:
    that:
      - >-
        not m3_qualification_generation_directory.stat.exists or
        (
          m3_qualification_generation_directory.stat.isdir and
          not m3_qualification_generation_directory.stat.islnk and
          m3_qualification_generation_directory.stat.pw_name == 'root' and
          m3_qualification_generation_directory.stat.gr_name == 'caddy' and
          m3_qualification_generation_directory.stat.mode in ['0750', '0550']
        )
    fail_msg: The run-specific qualification generation directory is unsafe.

- name: Create the new run-specific Caddy generation directory
  ansible.builtin.file:
    path: "{{ m3_qualification_generation_root }}/{{ m3_qualification_generation }}"
    state: directory
    owner: root
    group: caddy
    mode: "0750"
  when: not m3_qualification_generation_directory.stat.exists

- name: Install the qualification Python package source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../tools/m3-qualification/src/lowerduckpond_m3_qualification/"
    dest: "{{ m3_qualification_install_root }}/lowerduckpond_m3_qualification/"
    owner: root
    group: root
    mode: preserve
  notify: Restart M3 qualification fixture

- name: Install qualification executable helpers
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/libexec/lowerduckpond/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - m3-caddy-generation
    - m3-caddy-hook
    - m3-qualification-tmpfs
  notify: Restart qualification Caddy

- name: Install the cookie-independent static fixture
  ansible.builtin.copy:
    content: "lowerduckpond-m3-cookie-independent-body\n"
    dest: "{{ m3_qualification_static_root }}/static"
    owner: root
    group: caddy
    mode: "0640"

- name: Install the response-fidelity fixture
  ansible.builtin.copy:
    content: |-
      <!doctype html>
      <meta charset="utf-8">
      <title>Lower Duck Pond M3 fidelity fixture</title>
      <p>edge-fidelity@example.invalid</p>
      <a href="http://example.invalid/plain-http">plain HTTP marker</a>
      <script type="application/json">{"provider_injection":false}</script>
      <style>@font-face { font-family: M3Fixture; src: url('/fixture.woff2'); }</style>
    dest: "{{ m3_qualification_static_root }}/fidelity"
    owner: root
    group: caddy
    mode: "0640"

- name: Install write-once origin-pull CA trust files
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', item.source) | trim }}\n"
    dest: >-
      {{ m3_qualification_generation_root }}/{{ m3_qualification_generation }}/{{ item.name }}
    owner: root
    group: caddy
    mode: "0440"
    force: false
  loop:
    - name: origin-pull-primary-ca.pem
      source: "{{ m3_qualification_origin_pull_primary_ca_path }}"
      enabled: "{{ m3_qualification_origin_pull_trust == 'dual' }}"
    - name: origin-pull-replacement-ca.pem
      source: "{{ m3_qualification_origin_pull_replacement_ca_path }}"
      enabled: true
  loop_control:
    label: "{{ item.name }}"
  when: item.enabled | bool
  no_log: true

- name: Validate the installed origin-pull CA certificates
  ansible.builtin.command:
    argv:
      - /usr/bin/openssl
      - x509
      - -in
      - "{{ item }}"
      - -noout
      - -checkend
      - "2678400"
  loop: "{{ m3_qualification_origin_pull_ca_paths }}"
  loop_control:
    label: "{{ item | basename }}"
  changed_when: false

- name: Read the installed origin-pull CA constraints
  ansible.builtin.command:
    argv:
      - /usr/bin/openssl
      - x509
      - -in
      - "{{ item }}"
      - -noout
      - -text
  loop: "{{ m3_qualification_origin_pull_ca_paths }}"
  loop_control:
    label: "{{ item | basename }}"
  register: m3_qualification_origin_pull_ca_constraints
  changed_when: false
  no_log: true

- name: Require CA signing constraints on installed origin-pull trust
  ansible.builtin.assert:
    that:
      - "'CA:TRUE' in item.stdout"
      - "'Certificate Sign' in item.stdout"
    fail_msg: An origin-pull trust input is not a CA-signing certificate.
    quiet: true
  loop: "{{ m3_qualification_origin_pull_ca_constraints.results }}"
  loop_control:
    label: "{{ item.item | basename }}"
  no_log: true

- name: Verify each installed origin-pull CA as its own trust anchor
  ansible.builtin.command:
    argv:
      - /usr/bin/openssl
      - verify
      - -CAfile
      - "{{ item }}"
      - "{{ item }}"
  loop: "{{ m3_qualification_origin_pull_ca_paths }}"
  loop_control:
    label: "{{ item | basename }}"
  changed_when: false

- name: Read the installed origin-pull CA certificate checksums
  ansible.builtin.stat:
    path: >-
      {{ m3_qualification_generation_root }}/{{ m3_qualification_generation }}/{{ item.name }}
    checksum_algorithm: sha256
  loop:
    - name: origin-pull-primary-ca.pem
      source: "{{ m3_qualification_origin_pull_primary_ca_path }}"
      enabled: "{{ m3_qualification_origin_pull_trust == 'dual' }}"
    - name: origin-pull-replacement-ca.pem
      source: "{{ m3_qualification_origin_pull_replacement_ca_path }}"
      enabled: true
  loop_control:
    label: "{{ item.name }}"
  when: item.enabled | bool
  register: m3_qualification_installed_origin_pull_ca_files
  no_log: true

- name: Require write-once origin-pull CA files to match this run
  ansible.builtin.assert:
    that:
      - >-
        item.stat.checksum ==
        (((lookup('ansible.builtin.file', item.item.source) | trim) ~ '\n') |
         hash('sha256'))
    fail_msg: Refusing to replace origin-pull trust in an existing qualification generation.
    quiet: true
  loop: "{{ m3_qualification_installed_origin_pull_ca_files.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.item.enabled | bool
  no_log: true

- name: Provision the qualification Caddy log
  ansible.builtin.import_tasks: log.yml

- name: Install the qualification Caddy generation
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: >-
      {{ m3_qualification_generation_root }}/{{ m3_qualification_generation }}/Caddyfile
    owner: root
    group: caddy
    mode: "0440"
    force: false
    validate: /usr/local/libexec/lowerduckpond/caddy-validate %s
  no_log: true
  notify: Restart qualification Caddy

- name: Read the installed qualification Caddy generation
  ansible.builtin.stat:
    path: >-
      {{ m3_qualification_generation_root }}/{{ m3_qualification_generation }}/Caddyfile
    checksum_algorithm: sha256
  register: m3_qualification_installed_caddy

- name: Require the write-once Caddy generation to match this run
  ansible.builtin.assert:
    that:
      - >-
        m3_qualification_installed_caddy.stat.checksum ==
        (lookup('ansible.builtin.template', 'Caddyfile.j2') | hash('sha256'))
    fail_msg: Refusing to replace an existing qualification Caddy generation.
    quiet: true
  no_log: true

- name: Remove write permission from the complete Caddy generation
  ansible.builtin.file:
    path: "{{ m3_qualification_generation_root }}/{{ m3_qualification_generation }}"
    state: directory
    owner: root
    group: caddy
    mode: "0550"

- name: Select the qualification Caddy generation
  ansible.builtin.file:
    path: "{{ m3_qualification_active_path }}"
    src: "{{ m3_qualification_generation_root }}/{{ m3_qualification_generation }}"
    state: link
    owner: root
    group: caddy
    force: true
  notify: Restart qualification Caddy

- name: Install qualification systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - caddy.service
    - ldp-m3-fixture.service
    - ldp-m3-recovery.service
    - ldp-m3-tmpfs.service
  notify:
    - Reload systemd for M3 qualification
    - Restart M3 qualification fixture
    - Restart qualification Caddy

- name: Flush qualification handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start the hostile loopback fixture
  ansible.builtin.systemd_service:
    name: ldp-m3-fixture.service
    enabled: true
    state: started

- name: Enable and start qualification Caddy
  ansible.builtin.systemd_service:
    name: caddy.service
    enabled: true
    state: started
