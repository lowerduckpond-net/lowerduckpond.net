---
- name: Generate configured locale
  ansible.builtin.command:
    cmd: locale-gen "{{ base_locale }}"
  changed_when: true

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted

- name: Apply sysctl configuration
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

- name: Reload OpenSSH
  ansible.builtin.systemd_service:
    name: ssh.service
    state: reloaded
