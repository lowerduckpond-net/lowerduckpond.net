---
- name: Prove the selected Caddy generation is authoritative before opening publication
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/lowerduckpond/check-caddy-publication-open
  register: static_host_agent_authoritative_generation
  changed_when: false
  failed_when: >-
    static_host_agent_authoritative_generation.rc != 0 or
    static_host_agent_authoritative_generation.stdout | trim != 'current'

- name: Open static publication after complete host convergence
  ansible.builtin.template:
    src: static-publication.json.j2
    dest: /etc/lowerduckpond/static-publication.json
    owner: root
    group: root
    mode: "0400"
  vars:
    static_publication_gate_enabled: true
  changed_when: >-
    not static_host_agent_publication_configuration.stat.exists or
    static_host_agent_publication_gate_probe.rc | default(78) != 0

- name: Prove job issuance is enabled at the converged publication boundary
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/lowerduckpond/static-publication-gate
      - job-issuance
  changed_when: false
