---
- name: Validate supplied dedicated archive configuration
  ansible.builtin.assert:
    that:
      - static_host_agent_archive_configuration is mapping
      - >-
        static_host_agent_archive_configuration.keys() | sort ==
        ['accessKeyId', 'bucket', 'format', 'region', 'secretAccessKey']
      - static_host_agent_archive_configuration.format == 'lowerduckpond-archive-configuration-v1'
      - static_host_agent_archive_configuration.accessKeyId | length > 0
      - static_host_agent_archive_configuration.secretAccessKey | length > 0
      - static_host_agent_archive_configuration.region is match('^[a-z]{3}[1-9][0-9]?$')
      - static_host_agent_archive_configuration.bucket is match('^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$')
    quiet: true
  when: static_host_agent_archive_configuration | length > 0
  no_log: true

- name: Install backup isolation before publishing archive credentials
  when: static_host_agent_archive_configuration | length > 0
  block:
    - name: Inspect whether archive credentials have been installed
      ansible.builtin.stat:
        path: /etc/lowerduckpond/archive/credentials.json
      register: static_host_agent_archive_credential_presence

    - name: Create backup service isolation directories
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}.d"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - lowerduckpond-backup.service
        - lowerduckpond-backup-maintenance.service

    - name: Isolate future backup invocations from archive authority
      ansible.builtin.copy:
        content: |
          [Service]
          InaccessiblePaths=-/etc/lowerduckpond/archive
          InaccessiblePaths=-/run/lowerduckpond-archive
        dest: "/etc/systemd/system/{{ item }}.d/m3-10-archive-isolation.conf"
        owner: root
        group: root
        mode: "0644"
      loop:
        - lowerduckpond-backup.service
        - lowerduckpond-backup-maintenance.service
      register: static_host_agent_backup_archive_isolation

    - name: Load backup isolation before draining older invocations
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: >-
        static_host_agent_backup_archive_isolation.changed or
        not static_host_agent_archive_credential_presence.stat.exists

    - name: Inspect existing backup services before first credential installation
      ansible.builtin.service_facts:
      when: >-
        static_host_agent_backup_archive_isolation.changed or
        not static_host_agent_archive_credential_presence.stat.exists

    - name: Drain backup processes started before archive isolation was loaded
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop:
        - lowerduckpond-backup.service
        - lowerduckpond-backup-maintenance.service
      when:
        - >-
          static_host_agent_backup_archive_isolation.changed or
          not static_host_agent_archive_credential_presence.stat.exists
        - item in ansible_facts.services

- name: Install only the dedicated archive credential in its private boundary
  ansible.builtin.copy:
    content: "{{ static_host_agent_archive_configuration | to_json }}\n"
    dest: /etc/lowerduckpond/archive/credentials.json
    owner: root
    group: root
    mode: "0600"
  when: static_host_agent_archive_configuration | length > 0
  no_log: true
  diff: false

- name: Remove the dedicated archive credential when configuration is withdrawn
  ansible.builtin.file:
    path: /etc/lowerduckpond/archive/credentials.json
    state: absent
  when: static_host_agent_archive_configuration | length == 0
  register: static_host_agent_archive_credential_withdrawal
  no_log: true
  diff: false
