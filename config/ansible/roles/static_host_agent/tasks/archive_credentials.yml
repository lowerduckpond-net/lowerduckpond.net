---
- name: Validate supplied dedicated archive configuration
  ansible.builtin.assert:
    that:
      - static_host_agent_archive_configuration is mapping
      - >-
        static_host_agent_archive_configuration.keys() | sort ==
        ['accessKeyId', 'bucket', 'format', 'region', 'secretAccessKey']
      - static_host_agent_archive_configuration.format == 'lowerduckpond-archive-configuration-v1'
      - static_host_agent_archive_configuration.accessKeyId | length > 0
      - static_host_agent_archive_configuration.secretAccessKey | length > 0
      - static_host_agent_archive_configuration.region is match('^[a-z]{3}[1-9][0-9]?$')
      - static_host_agent_archive_configuration.bucket is match('^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$')
    quiet: true
  when: static_host_agent_archive_configuration | length > 0
  no_log: true

- name: Install ordinary service isolation before publishing archive credentials
  when: static_host_agent_archive_configuration | length > 0
  block:
    - name: Inspect whether archive credentials have been installed
      ansible.builtin.stat:
        path: /etc/lowerduckpond/archive/credentials.json
        get_checksum: false
        get_mime: false
      register: static_host_agent_archive_credential_presence

    - name: Create ordinary service isolation directories
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}.d"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - lowerduckpond-backup.service
        - lowerduckpond-backup-maintenance.service
        - lowerduckpond-backup-identity.service
        - lowerduckpond-audit-initialize.service
        - lowerduckpond-audit-verify.service
        - lowerduckpond-audit-rotate.service
        - lowerduckpond-static-reconcile.service

    - name: Isolate future ordinary service invocations from archive authority
      ansible.builtin.copy:
        content: |
          [Service]
          InaccessiblePaths=-/etc/lowerduckpond/archive
          InaccessiblePaths=-/run/lowerduckpond-archive
        dest: "/etc/systemd/system/{{ item }}.d/m3-10-archive-isolation.conf"
        owner: root
        group: root
        mode: "0644"
      loop:
        - lowerduckpond-backup.service
        - lowerduckpond-backup-maintenance.service
        - lowerduckpond-backup-identity.service
        - lowerduckpond-audit-initialize.service
        - lowerduckpond-audit-verify.service
        - lowerduckpond-audit-rotate.service
        - lowerduckpond-static-reconcile.service
      register: static_host_agent_ordinary_archive_isolation

    - name: Load ordinary service isolation before draining older invocations
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: >-
        static_host_agent_ordinary_archive_isolation.changed or
        not static_host_agent_archive_credential_presence.stat.exists

    - name: Inspect existing ordinary services before first credential installation
      ansible.builtin.service_facts:
      when: >-
        static_host_agent_ordinary_archive_isolation.changed or
        not static_host_agent_archive_credential_presence.stat.exists

    - name: Drain ordinary processes started before archive isolation was loaded
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop:
        - lowerduckpond-backup.service
        - lowerduckpond-backup-maintenance.service
        - lowerduckpond-backup-identity.service
        - lowerduckpond-audit-initialize.service
        - lowerduckpond-audit-verify.service
        - lowerduckpond-audit-rotate.service
        - lowerduckpond-static-reconcile.service
      when:
        - >-
          static_host_agent_ordinary_archive_isolation.changed or
          not static_host_agent_archive_credential_presence.stat.exists
        - item in ansible_facts.services

- name: Install only the dedicated archive credential in its private boundary
  ansible.builtin.copy:
    content: "{{ static_host_agent_archive_configuration | to_json }}\n"
    dest: /etc/lowerduckpond/archive/credentials.json
    owner: root
    group: root
    mode: "0600"
  when: static_host_agent_archive_configuration | length > 0
  no_log: true
  diff: false

- name: Inspect credential withdrawal authority
  when: static_host_agent_archive_configuration | length == 0
  block:
    - name: Inspect the archive credential before withdrawal
      ansible.builtin.stat:
        path: /etc/lowerduckpond/archive/credentials.json
        get_checksum: false
        get_mime: false
      register: static_host_agent_archive_withdrawal_file

    - name: Inspect archive processes that may retain loaded credentials
      ansible.builtin.command:
        argv:
          - systemctl
          - list-units
          - --all
          - --full
          - --plain
          - --no-legend
          - --type=service
          - --state=active,activating,deactivating,reloading
          - lowerduckpond-archive-export@*.service
          - lowerduckpond-archive-construction@*.service
          - lowerduckpond-archive-cleanup@*.service
          - lowerduckpond-static-emergency-reconcile.service
      changed_when: false
      register: static_host_agent_archive_withdrawal_instances

    - name: Inspect installed archive and emergency activation units
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ item }}"
      loop:
        - lowerduckpond-archive-export.socket
        - lowerduckpond-archive-construction.socket
        - lowerduckpond-archive-cleanup.socket
        - lowerduckpond-static-emergency-reconcile.timer
      register: static_host_agent_archive_withdrawal_activation_units

    - name: Stop new archive activations before withdrawing authority
      ansible.builtin.systemd_service:
        name: "{{ item.item }}"
        state: stopped
      loop: "{{ static_host_agent_archive_withdrawal_activation_units.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.stat.exists
        - >-
          static_host_agent_archive_withdrawal_file.stat.exists or
          static_host_agent_archive_withdrawal_instances.stdout | length > 0

- name: Remove the credential file before draining loaded archive authority
  ansible.builtin.file:
    path: /etc/lowerduckpond/archive/credentials.json
    state: absent
  when: static_host_agent_archive_configuration | length == 0
  register: static_host_agent_archive_credential_withdrawal
  no_log: true
  diff: false

- name: Finish withdrawal of credentials already loaded by archive processes
  when: static_host_agent_archive_configuration | length == 0
  block:
    - name: Inspect remaining archive processes after closing activation and credential access
      ansible.builtin.command:
        argv:
          - systemctl
          - list-units
          - --all
          - --full
          - --plain
          - --no-legend
          - --type=service
          - --state=active,activating,deactivating,reloading
          - lowerduckpond-archive-export@*.service
          - lowerduckpond-archive-construction@*.service
          - lowerduckpond-archive-cleanup@*.service
          - lowerduckpond-static-emergency-reconcile.service
      changed_when: false
      register: static_host_agent_archive_withdrawal_remaining

    - name: Stop each archive process that could retain withdrawn credentials
      ansible.builtin.systemd_service:
        name: "{{ item.split()[0] }}"
        state: stopped
      loop: "{{ static_host_agent_archive_withdrawal_remaining.stdout_lines }}"
