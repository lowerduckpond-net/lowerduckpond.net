---
- name: Create the provisioner group
  ansible.builtin.group:
    name: "{{ provisioner_group }}"
    system: true

- name: Create the non-login provisioner account
  ansible.builtin.user:
    name: "{{ provisioner_user }}"
    group: "{{ provisioner_group }}"
    home: /nonexistent
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Create the root-owned content parent
  ansible.builtin.file:
    path: "{{ provisioner_content_root }}"
    state: directory
    owner: root
    group: root
    mode: "0711"

- name: Remove the retired Milestone 2 route-publishing capability
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/sudoers.d/lowerduckpond-provisioner
    - /usr/local/libexec/lowerduckpond/publish-caddy-routes
