---
- name: Create the provisioner group
  ansible.builtin.group:
    name: "{{ provisioner_group }}"
    system: true

- name: Create the non-login provisioner account
  ansible.builtin.user:
    name: "{{ provisioner_user }}"
    group: "{{ provisioner_group }}"
    home: "{{ provisioner_state_root }}/provisioner"
    shell: /usr/sbin/nologin
    system: true
    create_home: true

- name: Protect the provisioner home
  ansible.builtin.file:
    path: "{{ provisioner_state_root }}/provisioner"
    state: directory
    owner: "{{ provisioner_user }}"
    group: "{{ provisioner_group }}"
    mode: "0750"

- name: Create provisioner state and content directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ provisioner_content_root }}"
      owner: root
      group: root
      mode: "0711"
    - path: "{{ provisioner_state_root }}/jobs"
      owner: "{{ provisioner_user }}"
      group: "{{ provisioner_group }}"
      mode: "0750"
    - path: "{{ provisioner_state_root }}/manifests"
      owner: "{{ provisioner_user }}"
      group: "{{ provisioner_group }}"
      mode: "0750"
    - path: "{{ provisioner_state_root }}/audit"
      owner: "{{ provisioner_user }}"
      group: "{{ provisioner_group }}"
      mode: "0750"

- name: Remove the retired Milestone 2 route-publishing capability
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/sudoers.d/lowerduckpond-provisioner
    - /usr/local/libexec/lowerduckpond/publish-caddy-routes
