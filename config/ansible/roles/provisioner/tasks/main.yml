---
- name: Create the provisioner groups
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
  loop:
    - "{{ provisioner_group }}"
    - "{{ provisioner_routes_group }}"

- name: Create the non-login provisioner account
  ansible.builtin.user:
    name: "{{ provisioner_user }}"
    group: "{{ provisioner_group }}"
    groups: "{{ provisioner_routes_group }}"
    append: true
    home: "{{ provisioner_state_root }}/provisioner"
    shell: /usr/sbin/nologin
    system: true
    create_home: true

- name: Protect the provisioner home
  ansible.builtin.file:
    path: "{{ provisioner_state_root }}/provisioner"
    state: directory
    owner: "{{ provisioner_user }}"
    group: "{{ provisioner_group }}"
    mode: "0750"

- name: Permit Caddy to read generated routes
  ansible.builtin.user:
    name: caddy
    groups: "{{ provisioner_routes_group }}"
    append: true
  notify: Restart Caddy after route group change

- name: Create provisioner state and content directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ provisioner_state_root }}/jobs"
      owner: "{{ provisioner_user }}"
      group: "{{ provisioner_group }}"
      mode: "0750"
    - path: "{{ provisioner_state_root }}/manifests"
      owner: "{{ provisioner_user }}"
      group: "{{ provisioner_group }}"
      mode: "0750"
    - path: "{{ provisioner_state_root }}/audit"
      owner: "{{ provisioner_user }}"
      group: "{{ provisioner_group }}"
      mode: "0750"
    - path: "{{ provisioner_content_root }}/sites"
      owner: "{{ provisioner_user }}"
      group: caddy
      mode: "0750"
    - path: /etc/caddy/sites-enabled
      owner: "{{ provisioner_user }}"
      group: "{{ provisioner_routes_group }}"
      mode: "0770"

- name: Install the restricted Caddy reload command
  ansible.builtin.copy:
    src: reload-caddy
    dest: /usr/local/libexec/lowerduckpond/reload-caddy
    owner: root
    group: root
    mode: "0755"

- name: Permit only validated Caddy reloads through sudo
  ansible.builtin.template:
    src: sudoers.j2
    dest: /etc/sudoers.d/lowerduckpond-provisioner
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo --check --file=%s

- name: Flush provisioner handlers
  ansible.builtin.meta: flush_handlers
