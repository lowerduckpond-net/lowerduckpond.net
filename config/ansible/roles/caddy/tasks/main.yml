---
- name: Require the canonical immutable Caddy publication lock
  ansible.builtin.assert:
    that:
      - >-
        caddy_publication_lock_path ==
        '/var/lib/lowerduckpond/static/locks/publication.lock'
    fail_msg: >-
      Immutable Caddy startup is bound to the canonical publication lock;
      refusing a divergent lock path.
    quiet: true
  when: caddy_generation_enabled | bool

- name: Install Caddy build dependencies
  ansible.builtin.apt:
    name:
      - git
      - golang-go
      - openssl
      - util-linux
    state: present

- name: Create the Caddy system group
  ansible.builtin.group:
    name: caddy
    system: true

- name: Create the Caddy system account
  ansible.builtin.user:
    name: caddy
    group: caddy
    home: /var/lib/caddy
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Create Caddy build and runtime directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ caddy_build_root }}"
      owner: root
      group: root
      mode: "0755"
    - path: /var/cache/lowerduckpond-go
      owner: root
      group: root
      mode: "0755"
    - path: /var/cache/lowerduckpond-go/build
      owner: root
      group: root
      mode: "0755"
    - path: /var/cache/lowerduckpond-go/modules
      owner: root
      group: root
      mode: "0755"
    - path: /var/cache/lowerduckpond-go/tmp
      owner: root
      group: root
      mode: "0755"
    - path: /usr/local/libexec/lowerduckpond
      owner: root
      group: root
      mode: "0755"
    - path: /etc/caddy
      owner: root
      group: caddy
      mode: "0750"
    - path: "{{ caddy_routes_active_path }}"
      owner: root
      group: caddy
      mode: "0750"
    - path: /var/lib/caddy
      owner: caddy
      group: caddy
      mode: "0700"
    - path: /var/log/caddy
      owner: caddy
      group: caddy
      mode: "0750"
    - path: "{{ caddy_fixture_root }}"
      owner: root
      group: caddy
      mode: "0750"

- name: Build pinned Caddy with the pinned Cloudflare module
  ansible.builtin.command:
    argv:
      - /usr/bin/go
      - run
      - "github.com/caddyserver/xcaddy/cmd/xcaddy@v{{ caddy_xcaddy_version }}"
      - build
      - "v{{ caddy_version }}"
      - --with
      - "github.com/caddy-dns/cloudflare@v{{ caddy_cloudflare_module_version }}"
      - --output
      - "{{ caddy_binary_path }}"
    creates: "{{ caddy_binary_path }}"
  environment:
    GOCACHE: /var/cache/lowerduckpond-go/build
    GOMODCACHE: /var/cache/lowerduckpond-go/modules
    GOTMPDIR: /var/cache/lowerduckpond-go/tmp
  notify: Restart Caddy

- name: Set custom Caddy binary ownership and mode
  ansible.builtin.file:
    path: "{{ caddy_binary_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Select the pinned Caddy binary
  ansible.builtin.file:
    path: /usr/local/bin/caddy
    src: "{{ caddy_binary_path }}"
    state: link
    force: true
  notify: Restart Caddy

- name: Read installed Caddy modules
  ansible.builtin.command:
    cmd: /usr/local/bin/caddy list-modules
  register: caddy_installed_modules
  changed_when: false

- name: Verify the Cloudflare DNS module is present
  ansible.builtin.assert:
    that:
      - '"dns.providers.cloudflare" in caddy_installed_modules.stdout_lines'
    fail_msg: The custom Caddy binary does not contain dns.providers.cloudflare.

- name: Install the Caddy environment file
  ansible.builtin.template:
    src: environment.j2
    dest: /etc/caddy/environment
    owner: root
    group: caddy
    mode: "0640"
  no_log: true
  notify: Restart Caddy

- name: Install the Caddy validation wrapper
  ansible.builtin.copy:
    src: caddy-validate
    dest: /usr/local/libexec/lowerduckpond/caddy-validate
    owner: root
    group: root
    mode: "0755"

- name: Install the known static fixture
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ caddy_fixture_root }}/index.html"
    owner: root
    group: caddy
    mode: "0640"

- name: Inspect tenant route inputs before rendering Caddy
  ansible.builtin.find:
    paths: "{{ caddy_routes_active_path }}"
    hidden: true
    recurse: true
    file_type: any
  register: caddy_tenant_route_inputs
  when: not caddy_generation_enabled | bool

- name: Keep tenant Caddy generation dark during Milestone 3.5
  ansible.builtin.assert:
    that:
      - not static_publication_enabled | bool
      - caddy_tenant_route_inputs.matched == 0
    fail_msg: >-
      M3.5 refuses static publication and any tenant-bearing Caddy candidate.
  when: not caddy_generation_enabled | bool

- name: Install the Caddy configuration atomically after validation
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
    validate: /usr/local/libexec/lowerduckpond/caddy-validate %s
  no_log: true
  notify: Reload Caddy
  when: not caddy_generation_enabled | bool

- name: Install the hardened Caddy service
  ansible.builtin.template:
    src: caddy.service.j2
    dest: /etc/systemd/system/caddy.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for Caddy
    - Restart Caddy
  when: not caddy_generation_enabled | bool

- name: Flush Caddy handlers before starting the service
  ansible.builtin.meta: flush_handlers
  when: not caddy_generation_enabled | bool

- name: Enable and start Caddy
  ansible.builtin.systemd_service:
    name: caddy.service
    enabled: true
    state: started
  when: not caddy_generation_enabled | bool

- name: Inspect controller origin-pull CA inputs
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
    follow: false
  loop: "{{ caddy_origin_pull_ca_paths }}"
  register: caddy_controller_origin_pull_ca_inputs
  delegate_to: localhost
  become: false
  when: caddy_generation_enabled | bool

- name: Require one or two regular controller origin-pull CA inputs
  ansible.builtin.assert:
    that:
      - caddy_origin_pull_ca_paths | length in [1, 2]
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
      - item.stat.size > 0
      - item.stat.size <= 65536
    quiet: true
  loop: "{{ caddy_controller_origin_pull_ca_inputs.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: caddy_generation_enabled | bool

- name: Require distinct origin-pull CA inputs
  ansible.builtin.assert:
    that:
      - >-
        caddy_controller_origin_pull_ca_inputs.results |
        map(attribute='stat.checksum') | unique | list | length ==
        caddy_origin_pull_ca_paths | length
    quiet: true
  when: caddy_generation_enabled | bool

- name: Stage generation-bound origin-pull CA inputs
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/caddy/origin-pull-ca-{{ index }}.pem"
    owner: root
    group: caddy
    mode: "0440"
  no_log: true
  loop: "{{ caddy_origin_pull_ca_paths }}"
  loop_control:
    index_var: index
  register: caddy_origin_pull_ca_installation
  when: caddy_generation_enabled | bool

- name: Remove retired staged origin-pull CA inputs
  ansible.builtin.file:
    path: "/etc/caddy/origin-pull-ca-{{ item }}.pem"
    state: absent
  loop: "{{ range(caddy_origin_pull_ca_paths | length, 2) | list }}"
  when: caddy_generation_enabled | bool

- name: Record the installed origin-pull CA input paths
  ansible.builtin.set_fact:
    caddy_installed_origin_pull_ca_paths: >-
      {{ caddy_origin_pull_ca_installation.results |
      map(attribute='dest') | list }}
  when: caddy_generation_enabled | bool

- name: Verify each installed origin-pull CA certificate
  ansible.builtin.command:
    argv:
      - /usr/bin/openssl
      - verify
      - -x509_strict
      - -CAfile
      - "{{ item }}"
      - "{{ item }}"
  changed_when: false
  loop: "{{ caddy_installed_origin_pull_ca_paths }}"
  when: caddy_generation_enabled | bool

- name: Read installed origin-pull CA constraints and expiry
  ansible.builtin.command:
    argv:
      - /usr/bin/openssl
      - x509
      - -in
      - "{{ item }}"
      - -noout
      - -checkend
      - "604800"
      - -text
  changed_when: false
  loop: "{{ caddy_installed_origin_pull_ca_paths }}"
  register: caddy_origin_pull_ca_constraints
  when: caddy_generation_enabled | bool

- name: Require CA signing constraints on origin-pull trust
  ansible.builtin.assert:
    that:
      - "'CA:TRUE' in item.stdout"
      - "'Certificate Sign' in item.stdout"
    quiet: true
  loop: "{{ caddy_origin_pull_ca_constraints.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: caddy_generation_enabled | bool

- name: Read the trusted Caddy binary identity
  ansible.builtin.stat:
    path: "{{ caddy_binary_path }}"
    checksum_algorithm: sha256
    follow: false
  register: caddy_generation_binary
  when: caddy_generation_enabled | bool

- name: Require the exact trusted Caddy binary metadata
  ansible.builtin.assert:
    that:
      - caddy_generation_binary.stat.exists
      - caddy_generation_binary.stat.isreg
      - not caddy_generation_binary.stat.islnk
      - caddy_generation_binary.stat.pw_name == 'root'
      - caddy_generation_binary.stat.gr_name == 'root'
      - caddy_generation_binary.stat.mode == '0755'
      - caddy_generation_binary.stat.checksum is match('^[0-9a-f]{64}$')
    quiet: true
  when: caddy_generation_enabled | bool

- name: Probe immutable Caddy bootstrap installation changes
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/libexec/lowerduckpond/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - bootstrap-caddy-generation
    - launch-caddy-generation
    - prepare-caddy-generation-start
    - recover-caddy-generation-start
    - verify-caddy-generation-start
  check_mode: true
  register: caddy_generation_bootstrap_probe
  when: caddy_generation_enabled | bool

- name: Probe the immutable Caddy generation check
  ansible.builtin.template:
    src: check-caddy-generation.j2
    dest: /usr/local/libexec/lowerduckpond/check-caddy-generation
    owner: root
    group: root
    mode: "0755"
  check_mode: true
  register: caddy_generation_check_probe
  when: caddy_generation_enabled | bool

- name: Probe the immutable Caddy unit change
  ansible.builtin.template:
    src: caddy-generation.service.j2
    dest: /etc/systemd/system/caddy.service
    owner: root
    group: root
    mode: "0644"
  check_mode: true
  register: caddy_generation_unit_probe
  when: caddy_generation_enabled | bool

- name: Probe the immutable Caddy recovery unit change
  ansible.builtin.template:
    src: caddy-recovery.service.j2
    dest: /etc/systemd/system/caddy-recovery.service
    owner: root
    group: root
    mode: "0644"
  check_mode: true
  register: caddy_generation_recovery_unit_probe
  when: caddy_generation_enabled | bool

- name: Check whether the platform-only generation is current
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/local/libexec/lowerduckpond/bootstrap-caddy-generation',
          static_host_agent_artifact_sha256,
          '--check',
          ('--origin-pull-required'
           if caddy_origin_pull_enforcement_enabled | bool
           else '--origin-pull-staged'),
          caddy_binary_path,
          caddy_generation_binary.stat.checksum,
          '/etc/caddy/environment'] +
         caddy_installed_origin_pull_ca_paths }}
  register: caddy_generation_check
  changed_when: false
  failed_when: >-
    caddy_generation_check.rc != 0 or
    caddy_generation_check.stdout | trim not in ['changed', 'pending', 'unchanged']
  when:
    - caddy_generation_enabled | bool
    - not static_publication_enabled | bool
    - >-
      caddy_generation_bootstrap_probe.results |
      selectattr('changed') | list | length == 0

- name: Refuse immutable Caddy input drift while tenant publication is enabled
  ansible.builtin.assert:
    that:
      - not static_host_agent_installation.changed | default(false)
      - >-
        caddy_generation_bootstrap_probe.results |
        selectattr('changed') | list | length == 0
      - not caddy_generation_check_probe.changed
      - not caddy_generation_unit_probe.changed
      - not caddy_generation_recovery_unit_probe.changed
    fail_msg: >-
      Immutable Caddy inputs changed while tenant publication is enabled;
      refusing to replace the selected tenant-capable generation with a
      platform-only bootstrap generation.
    quiet: true
  when:
    - caddy_generation_enabled | bool
    - static_publication_enabled | bool

- name: Decide whether a stopped and masked bootstrap transaction is required
  ansible.builtin.set_fact:
    caddy_generation_bootstrap_required: >-
      {{ not static_publication_enabled | bool and
         (caddy_generation_check.skipped | default(false) or
          caddy_generation_check.stdout | default('changed') | trim != 'unchanged' or
          static_host_agent_installation.changed | default(false) or
          caddy_generation_bootstrap_probe.results |
          selectattr('changed') | list | length > 0 or
          caddy_generation_check_probe.changed or
          caddy_generation_unit_probe.changed or
          caddy_generation_recovery_unit_probe.changed) }}
  when: caddy_generation_enabled | bool

- name: Inspect the existing Caddy unit before the bootstrap transaction
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - show
      - --property=LoadState
      - --value
      - caddy.service
  register: caddy_generation_existing_unit
  changed_when: false
  failed_when: caddy_generation_existing_unit.rc not in [0, 4]
  when: caddy_generation_enabled | bool

- name: Stop Caddy for the immutable bootstrap transaction
  ansible.builtin.systemd_service:
    name: caddy.service
    state: stopped
  when:
    - caddy_generation_enabled | bool
    - caddy_generation_bootstrap_required | bool
    - caddy_generation_existing_unit.stdout | trim == 'loaded'

- name: Runtime-mask Caddy for the immutable bootstrap transaction
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - mask
      - --runtime
      - caddy.service
  changed_when: true
  when:
    - caddy_generation_enabled | bool
    - caddy_generation_bootstrap_required | bool

- name: Install the frozen immutable Caddy bootstrap commands
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/libexec/lowerduckpond/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - bootstrap-caddy-generation
    - launch-caddy-generation
    - prepare-caddy-generation-start
    - recover-caddy-generation-start
    - verify-caddy-generation-start
  when:
    - caddy_generation_enabled | bool
    - caddy_generation_bootstrap_required | bool

- name: Install the frozen immutable Caddy generation check
  ansible.builtin.template:
    src: check-caddy-generation.j2
    dest: /usr/local/libexec/lowerduckpond/check-caddy-generation
    owner: root
    group: root
    mode: "0755"
  when:
    - caddy_generation_enabled | bool
    - caddy_generation_bootstrap_required | bool

- name: Install the immutable Caddy unit
  ansible.builtin.template:
    src: caddy-generation.service.j2
    dest: /etc/systemd/system/caddy.service
    owner: root
    group: root
    mode: "0644"
  when:
    - caddy_generation_enabled | bool
    - caddy_generation_bootstrap_required | bool

- name: Install the immutable Caddy recovery unit
  ansible.builtin.template:
    src: caddy-recovery.service.j2
    dest: /etc/systemd/system/caddy-recovery.service
    owner: root
    group: root
    mode: "0644"
  when:
    - caddy_generation_enabled | bool
    - caddy_generation_bootstrap_required | bool

- name: Reload systemd inside the immutable bootstrap transaction
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - caddy_generation_enabled | bool
    - caddy_generation_bootstrap_required | bool

- name: Build, validate, and select the complete platform-only generation
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/local/libexec/lowerduckpond/bootstrap-caddy-generation',
          static_host_agent_artifact_sha256,
          ('--origin-pull-required'
           if caddy_origin_pull_enforcement_enabled | bool
           else '--origin-pull-staged'),
          caddy_binary_path, caddy_generation_binary.stat.checksum,
          '/etc/caddy/environment'] + caddy_installed_origin_pull_ca_paths }}
  register: caddy_generation_bootstrap
  changed_when: caddy_generation_bootstrap.stdout | trim == 'changed'
  failed_when: >-
    caddy_generation_bootstrap.rc != 0 or
    caddy_generation_bootstrap.stdout | trim not in ['changed', 'unchanged']
  when:
    - caddy_generation_enabled | bool
    - caddy_generation_bootstrap_required | bool

- name: Remove any immutable-bootstrap runtime mask
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - unmask
      - --runtime
      - caddy.service
  register: caddy_generation_unmask
  changed_when: caddy_generation_unmask.stdout | trim != ''
  when: caddy_generation_enabled | bool

- name: Reload systemd after removing the immutable-bootstrap runtime mask
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - caddy_generation_enabled | bool
    - caddy_generation_bootstrap_required | bool

- name: Reset immutable Caddy startup limits after bootstrap
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - reset-failed
      - caddy.service
      - caddy-recovery.service
  changed_when: true
  when:
    - caddy_generation_enabled | bool
    - caddy_generation_bootstrap_required | bool
    - caddy_generation_existing_unit.stdout | trim == 'loaded'

- name: Enable and start immutable Caddy
  ansible.builtin.systemd_service:
    name: caddy.service
    enabled: true
    state: started
  when: caddy_generation_enabled | bool
